<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giải phóng mặt bằng Bắc Bình</title>
    <style>
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --panel-2: #f9fafb;
  --ink: #18202a;
  --muted: #5f6b7a;
  --line: #d9e0e7;
  --line-strong: #b9c4cf;
  --blue: #2563eb;
  --green: #087f5b;
  --amber: #b7791f;
  --red: #c2413b;
  --teal: #0f766e;
  --shadow: 0 10px 30px rgba(20, 31, 43, 0.08);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-width: 320px;
  color: var(--ink);
  background: var(--bg);
  font-family: Arial, "Helvetica Neue", sans-serif;
  letter-spacing: 0;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  border: 0;
}

.boot {
  display: grid;
  min-height: 100vh;
  place-items: center;
  color: var(--muted);
}

.shell {
  display: grid;
  grid-template-columns: 286px minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: auto;
  border-right: 1px solid var(--line);
  background: #111827;
  color: #e5e7eb;
}

.brand {
  padding: 18px 18px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}

.brand-asset {
  display: block;
  width: 100%;
  height: 88px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.18);
  margin-bottom: 14px;
}

.brand h1 {
  margin: 0 0 6px;
  font-size: 18px;
  line-height: 1.25;
}

.brand p {
  margin: 0;
  color: #b8c2d0;
  font-size: 13px;
  line-height: 1.35;
}

.nav {
  display: grid;
  gap: 4px;
  padding: 14px 10px;
}

.nav button,
.commune-list button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 38px;
  padding: 9px 10px;
  color: #cbd5e1;
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  text-align: left;
}

.nav button:hover,
.commune-list button:hover {
  background: rgba(255,255,255,0.08);
  color: #ffffff;
}

.nav button.active,
.commune-list button.active {
  color: #ffffff;
  background: #1f3b62;
}

.sidebar-section {
  padding: 10px;
  border-top: 1px solid rgba(255,255,255,0.12);
}

.project-section {
  display: grid;
  gap: 8px;
}

.sidebar-label {
  margin: 3px 8px 8px;
  color: #9ca3af;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.project-select {
  width: 100%;
  min-height: 38px;
  padding: 8px 10px;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 8px;
  color: #f8fafc;
  background: #0f172a;
}

.project-tools {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 38px;
  gap: 6px;
}

.project-tools .btn {
  min-width: 0;
  min-height: 34px;
  padding: 7px 8px;
  border-color: rgba(255,255,255,0.18);
  color: #e5e7eb;
  background: rgba(255,255,255,0.06);
}

.project-tools .btn:hover {
  border-color: rgba(255,255,255,0.32);
  background: rgba(255,255,255,0.1);
}

.project-tools .btn.danger {
  color: #fecaca;
  border-color: rgba(248,113,113,0.45);
}

.commune-list {
  display: grid;
  gap: 4px;
}

.main {
  min-width: 0;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 76px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(10px);
}

.title-block h2 {
  margin: 0;
  font-size: 22px;
  line-height: 1.25;
}

.title-block p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 36px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
  background: #ffffff;
  cursor: pointer;
  white-space: nowrap;
}

.btn:hover {
  border-color: var(--line-strong);
  background: #f8fafc;
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.btn.primary {
  border-color: var(--green);
  color: #ffffff;
  background: var(--green);
}

.btn.primary:hover {
  background: #066b4d;
}

.btn.danger {
  color: var(--red);
  border-color: #f1b8b4;
}

.btn.icon {
  width: 36px;
  padding: 0;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 13px;
}

.content {
  display: grid;
  gap: 18px;
  padding: 20px 24px 36px;
}

.auth-screen {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 24px;
  background: linear-gradient(135deg, #eef6f4, #f8fafc 48%, #eef2ff);
}

.auth-panel {
  display: grid;
  gap: 18px;
  width: min(460px, 100%);
  padding: 26px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #ffffff;
  box-shadow: var(--shadow);
}

.auth-panel h1 {
  margin: 0 0 8px;
  font-size: 24px;
}

.auth-panel p {
  margin: 0;
  color: var(--muted);
}

.auth-tabs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  padding: 4px;
  border-radius: 8px;
  background: var(--panel-2);
}

.auth-tabs button {
  min-height: 36px;
  border-radius: 6px;
  color: var(--muted);
  background: transparent;
  cursor: pointer;
}

.auth-tabs button.active {
  color: var(--ink);
  background: #ffffff;
  box-shadow: 0 1px 6px rgba(15, 23, 42, 0.08);
}

.auth-fields {
  display: grid;
  gap: 12px;
}

.auth-fields label {
  display: grid;
  gap: 6px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.auth-fields input {
  min-height: 40px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
  background: #ffffff;
}

.auth-error {
  color: var(--red);
  font-weight: 700;
}

.auth-message {
  color: var(--green);
  font-weight: 700;
}

.auth-submit {
  width: 100%;
}

.auth-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.panel {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: var(--shadow);
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}

.panel-header h3 {
  margin: 0;
  font-size: 16px;
}

.panel-header p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.panel-body {
  padding: 16px;
}

.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}

.project-card {
  display: grid;
  gap: 14px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #ffffff;
}

.project-card.active {
  border-color: #8fb7aa;
  background: #f4fbf8;
}

.project-card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.project-card h4 {
  margin: 0 0 5px;
  font-size: 16px;
}

.project-card p,
.member-row small {
  display: block;
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}

.project-card-stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.project-card-stats span {
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
  color: var(--muted);
}

.project-card-stats strong {
  display: block;
  color: var(--ink);
  font-size: 20px;
}

.project-card-actions,
.access-form {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.access-form {
  align-items: end;
  margin-bottom: 14px;
}

.access-form .field {
  flex: 1 1 230px;
}

.member-list {
  display: grid;
  gap: 8px;
}

.member-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
}

.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(160px, 1fr));
  gap: 12px;
}

.metric {
  min-height: 112px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
}

.metric label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.metric strong {
  display: block;
  margin-top: 10px;
  font-size: 28px;
  line-height: 1;
}

.metric span {
  display: block;
  margin-top: 8px;
  color: var(--muted);
  font-size: 13px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.field,
.textarea-field {
  display: grid;
  gap: 6px;
}

.field label,
.textarea-field label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.field input,
.field select,
.textarea-field textarea {
  width: 100%;
  min-height: 36px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 9px;
  color: var(--ink);
  background: #ffffff;
}

.textarea-field textarea {
  min-height: 116px;
  resize: vertical;
  line-height: 1.45;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.tabs {
  display: flex;
  gap: 6px;
  overflow: auto;
  padding-bottom: 2px;
}

.tab {
  flex: 0 0 auto;
  min-height: 34px;
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--muted);
  background: #ffffff;
  cursor: pointer;
}

.tab.active {
  color: #ffffff;
  border-color: var(--blue);
  background: var(--blue);
}

.table-wrap {
  width: 100%;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: #ffffff;
}

th,
td {
  min-width: 96px;
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
  padding: 8px;
  text-align: left;
  vertical-align: top;
  font-size: 13px;
}

th {
  position: sticky;
  top: 0;
  z-index: 1;
  color: #334155;
  background: #eef3f8;
  font-weight: 700;
}

tr:last-child td {
  border-bottom: 0;
}

td:last-child,
th:last-child {
  border-right: 0;
}

.sticky-col {
  position: sticky;
  left: 0;
  z-index: 2;
  min-width: 180px;
  background: inherit;
}

th.sticky-col {
  z-index: 3;
  background: #e4edf6;
}

td input,
td select,
td textarea {
  width: 100%;
  min-height: 32px;
  border: 1px solid #cfd8e3;
  border-radius: 6px;
  padding: 5px 7px;
  background: #ffffff;
}

td textarea {
  min-width: 220px;
  resize: vertical;
}

.stage-grid th.group {
  min-width: 180px;
  text-align: center;
  background: #e8f3ef;
}

.round-head {
  display: grid;
  gap: 6px;
  min-width: 190px;
}

.round-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.round-head input {
  width: 100%;
  min-height: 32px;
  border: 1px solid #b9c8d8;
  border-radius: 6px;
  padding: 5px 7px;
  font-weight: 400;
  background: #ffffff;
}

.stage-grid td.small,
.stage-grid th.small {
  min-width: 88px;
}

.round-parcel-list {
  display: grid;
  gap: 6px;
  min-width: 190px;
}

.round-parcel-list label {
  display: grid;
  gap: 3px;
}

.round-parcel-list label span {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.25;
}

.round-parcel-total {
  padding-top: 4px;
  border-top: 1px dashed var(--line);
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.case-row td {
  background: #f8fafc;
}

.case-editor {
  display: grid;
  gap: 6px;
}

.case-editor label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
}

.row-actions {
  display: flex;
  gap: 6px;
}

.parcel-detail-row td {
  padding: 0;
  background: #ffffff;
}

.parcel-box {
  display: grid;
  gap: 10px;
  padding: 12px;
  border-left: 4px solid #c7d7e8;
  background: #ffffff;
}

.parcel-box-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.parcel-table-wrap {
  border-radius: 6px;
}

.parcel-table th,
.parcel-table td {
  min-width: 112px;
}

.progress-list {
  display: grid;
  gap: 10px;
}

.progress-row {
  display: grid;
  grid-template-columns: minmax(220px, 1.2fr) minmax(180px, 2fr) 150px;
  gap: 12px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}

.progress-row:last-child {
  border-bottom: 0;
}

.bar {
  height: 10px;
  overflow: hidden;
  border-radius: 999px;
  background: #e5e7eb;
}

.bar span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--green), var(--blue));
}

.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 24px;
  padding: 3px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  background: var(--panel-2);
  font-size: 12px;
  font-weight: 700;
}

.pill.green {
  color: #075f45;
  border-color: #a5d6c5;
  background: #e8f7f1;
}

.pill.amber {
  color: #83520e;
  border-color: #f0cf91;
  background: #fff8e8;
}

.pill.red {
  color: #9f2f2a;
  border-color: #e7aaa6;
  background: #fff1f0;
}

.muted {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
}

.print-note {
  display: none;
  min-height: 42px;
  white-space: pre-wrap;
}

.report-title {
  margin: 0 0 12px;
  font-size: 22px;
  text-transform: uppercase;
}

.report-section-title {
  margin: 22px 0 10px;
  font-size: 16px;
  text-transform: uppercase;
}

.report-switcher-panel .panel-body {
  padding-top: 12px;
}

.report-switcher {
  display: grid;
  grid-template-columns: minmax(240px, 0.7fr) minmax(0, 1.5fr);
  gap: 12px;
}

.report-commune-picker {
  display: grid;
  gap: 8px;
}

.report-picker-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.report-commune-options {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 8px;
}

.report-choice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  min-height: 70px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
  background: #ffffff;
  cursor: pointer;
  text-align: left;
}

.report-choice:hover {
  border-color: var(--line-strong);
  background: #f8fafc;
}

.report-choice.active {
  border-color: var(--green);
  background: #edf8f3;
  box-shadow: inset 4px 0 0 var(--green);
}

.report-choice i {
  flex: 0 0 auto;
  margin-top: 2px;
}

.report-choice span {
  display: grid;
  gap: 4px;
}

.report-choice strong {
  line-height: 1.25;
}

.report-choice small {
  color: var(--muted);
  font-size: 12px;
}

.report-choice-summary {
  height: 100%;
}

.report-page {
  overflow: hidden;
}

.report-page-header {
  background: #f8fafc;
}

.report-scope-dashboard {
  display: grid;
  gap: 14px;
  margin: 10px 0 18px;
}

.report-scope-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.report-scope-heading h4,
.commune-report > h4,
.report-block-heading h4 {
  margin: 0;
  font-size: 15px;
}

.report-scope-heading span {
  color: var(--muted);
  font-size: 12px;
}

.report-metrics .metric strong {
  font-size: 22px;
}

.dashboard-grid,
.block-dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
}

.progress-card,
.report-stat {
  min-height: 118px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #ffffff;
}

.progress-card {
  display: grid;
  gap: 10px;
}

.progress-card strong,
.report-stat strong {
  display: block;
  line-height: 1.25;
}

.progress-card span,
.report-stat span,
.report-stat em {
  display: block;
  color: var(--muted);
  font-size: 12px;
  font-style: normal;
  line-height: 1.35;
}

.progress-meter {
  display: grid;
  gap: 5px;
}

.progress-meter label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.progress-card-foot {
  display: grid;
  gap: 3px;
}

.report-stat {
  min-height: 92px;
}

.report-stat strong {
  margin: 8px 0 5px;
  font-size: 18px;
}

.commune-report {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 2px solid var(--line);
}

.report-block {
  margin: 18px 0 24px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

.report-block-heading {
  margin-bottom: 10px;
}

.report-table-wrap {
  margin-top: 10px;
}

.report-detail-table th,
.report-detail-table td {
  min-width: 110px;
}

.report-detail-table .report-commune {
  min-width: 150px;
  background: #f8fafc;
  font-weight: 700;
}

.report-detail-table .summary-row td {
  background: #f4fbf7;
}

.report-detail-table .sub-row td {
  background: #ffffff;
}

.report-detail-table .ongoing-row td {
  background: #eef7ff;
}

.report-detail-table .pending-row td {
  background: #fff8e8;
}

.empty {
  padding: 18px;
  color: var(--muted);
  text-align: center;
}

.formula-list {
  display: grid;
  gap: 10px;
}

.formula-item {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #ffffff;
}

.formula-item strong {
  display: block;
  margin-bottom: 4px;
}

.formula-item code {
  display: block;
  white-space: pre-wrap;
  color: #0f5132;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 1080px) {
  .shell {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: static;
    height: auto;
  }

  .brand-asset {
    height: 72px;
  }

  .metrics {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 720px) {
  .topbar {
    align-items: flex-start;
    flex-direction: column;
    padding: 12px 14px;
  }

  .actions {
    width: 100%;
    flex-wrap: nowrap;
    justify-content: flex-start;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .actions .btn,
  .actions .status {
    flex: 0 0 auto;
  }

  .content {
    padding: 14px;
  }

  .metrics,
  .grid-2,
  .grid-3,
  .report-switcher,
  .dashboard-grid,
  .block-dashboard {
    grid-template-columns: 1fr;
  }

  .progress-row {
    grid-template-columns: 1fr;
  }
}

@media print {
  .sidebar,
  .topbar,
  .no-print {
    display: none !important;
  }

  .shell {
    display: block;
  }

  .content {
    padding: 0;
  }

  .panel {
    box-shadow: none;
    border: 0;
  }

  .print-note {
    display: block;
  }

  body {
    background: #ffffff;
  }
}

async function init() {
  try {
    if (initSupabaseClient()) {
      store.mode = "supabase";
      const { data, error } = await store.client.auth.getSession();
      if (error) throw error;
      store.session = data.session;
      store.user = data.session?.user || null;
      if (!store.authSubscribed) {
        store.authSubscribed = true;
        store.client.auth.onAuthStateChange((_event, session) => {
          store.session = session;
          store.user = session?.user || null;
          init();
        });
      }
      if (!store.user) {
        renderAuthShell();
        return;
      }
      await loadSupabaseState();
    } else {
      await loadLocalState();
    }
  } catch (error) {
    app.innerHTML = `<div class="boot">Không tải được app: ${escapeHtml(error.message)}</div>`;
  }
}

async function loadLocalState() {
  store.mode = "local";
  const response = await fetch("/api/state");
  if (!response.ok) throw new Error("Không đọc được dữ liệu local. Nếu chạy trên GitHub Pages, hãy cấu hình Supabase trước.");
  db = normalizeDb(await response.json());
  ui.projectId = db.activeProjectId;
  ui.communeId = projectCommunes()[0]?.id || "SLUY";
  applyUrlState();
  syncUiToProject();
  render();
}

function initSupabaseClient() {
  const config = window.GPMB_SUPABASE_CONFIG || {};
  const url = String(config.url || "").trim();
  const anonKey = String(config.anonKey || config.publishableKey || "").trim();
  if (!url || !anonKey || !window.supabase?.createClient) return false;
  if (!store.client) {
    store.client = window.supabase.createClient(url, anonKey);
  }
  return true;
}

async function loadSupabaseState() {
  await loadCurrentProfile();
  const { data: projectRows, error } = await store.client
    .from("projects")
    .select("id,name,state,created_by,updated_at")
    .order("updated_at", { ascending: false });
  if (error) throw error;

  const projectIds = (projectRows || []).map(row => row.id);
  if (!projectIds.length) {
    db = { schemaVersion: 2, activeProjectId: "", projects: [] };
    ui.projectId = "";
    ui.communeId = "";
    ui.reportScope = "summary";
    render();
    return;
  }
  await loadProjectMembers(projectIds);
  store.projectRoles = Object.fromEntries((projectRows || []).map(row => [row.id, projectRoleFromRow(row)]));
  const preferredProjectId = localStorage.getItem("gpmb.activeProjectId");
  db = normalizeDb({
    schemaVersion: 2,
    activeProjectId: projectIds.includes(preferredProjectId) ? preferredProjectId : projectIds[0],
    projects: (projectRows || []).map(row => ({
      ...(row.state || {}),
      id: row.id,
      name: row.name || row.state?.name || row.state?.meta?.projectName || "Dự án chưa đặt tên",
      updatedAt: row.updated_at,
      createdBy: row.created_by
    }))
  });
  ui.projectId = db.activeProjectId;
  ui.communeId = projectCommunes()[0]?.id || "";
  applyUrlState();
  syncUiToProject();
  render();
}

async function signIn() {

  const password = document.getElementById("authPassword")?.value;

  if (!email || !password) {

  }
  const { error } = await store.client.auth.signInWithPassword({ email, password });
  if (error) {
    store.authError = error.message;
    renderAuthShell();
    return;
  }
  await init();
}

async function signUp() {
  const email = document.getElementById("authEmail")?.value.trim();
  const password = document.getElementById("authPassword")?.value;
  const name = document.getElementById("authName")?.value.trim();
  store.authError = "";
  store.authMessage = "";
  if (!email || !password) {
    store.authError = "Nhập email và mật khẩu.";
    renderAuthShell();
    return;
  }
  const { error } = await store.client.auth.signUp({
    email,
    password,
    options: { data: { display_name: name || email } }
  });
  if (error) {
    store.authError = error.message;
    renderAuthShell();
    return;
  }
  store.authMessage = "Tài khoản đã được tạo. Nếu Supabase bật xác nhận email, hãy xác nhận email trước khi đăng nhập.";
  ui.authMode = "login";
  renderAuthShell();
}

async function signOut() {

async function loadCurrentProfile() {
  const { data, error } = await store.client
    .from("profiles")
    .select("id,email,display_name,is_app_admin")
    .eq("id", store.user.id)
    .maybeSingle();
  if (error) throw error;
  store.profile = data || {
    id: store.user.id,
    email: store.user.email,
    display_name: "",
    is_app_admin: false
  };
}

async function loadProjectMembers(projectIds = []) {
  store.projectMembers = {};
  if (!projectIds.length) return;
  const { data, error } = await store.client
    .from("project_members")
    .select("project_id,user_id,role,profiles(email,display_name)")
    .in("project_id", projectIds);
  if (error) throw error;
  (data || []).forEach(member => {
    store.projectMembers[member.project_id] ||= [];
    store.projectMembers[member.project_id].push(member);
  });
}

function projectRoleFromRow(row) {
  if (store.profile?.is_app_admin) return "admin";
  if (row.created_by === store.user?.id) return "owner";
  const member = (store.projectMembers[row.id] || []).find(item => item.user_id === store.user?.id);
  return member?.role || "";
}

function applyUrlState() {
  const params = new URLSearchParams(window.location.search);
  const project = params.get("project");
  const view = params.get("view");
  const commune = params.get("commune");
  const stage = params.get("stage");
  const report = params.get("report");
  if (db.projects.some(item => item.id === project)) {
    db.activeProjectId = project;
    ui.projectId = project;
  }
  const communes = projectCommunes();
  if (["dashboard", "update", "report", "formulas"].includes(view)) ui.view = view;
  if (communes.some(item => item.id === commune)) ui.communeId = commune;
  if (report === "summary") ui.reportScope = "summary";
  if (communes.some(item => item.id === report)) {
    ui.reportScope = report;
    ui.communeId = report;
  }
  const stageIds = ["measurement", "recoveryDecision", "handover", "notHandover", "remarks", ...STAGES.map(item => item.id)];
  if (stageIds.includes(stage)) ui.stageId = stage;
  syncUiToProject();
}

function normalizeDb(input) {
  const base = input || {};
  const projectSources = Array.isArray(base.projects) && base.projects.length
    ? base.projects
    : [{
      id: base.projectId || base.activeProjectId || "DUAN1",
      name: base.meta?.projectName || "Dự án 1",
      meta: base.meta,
      notes: base.notes,
      communes: base.communes,
      audit: base.audit
    }];
  const usedIds = new Set();
  const projects = projectSources.map((project, index) => {
    const normalized = normalizeProject(project, index);
    normalized.id = uniqueProjectId(normalized.id, normalized.name, usedIds, index);
    return normalized;
  });
  const activeProjectId = projects.some(project => project.id === base.activeProjectId)
    ? base.activeProjectId
    : projects[0]?.id;
  return {
    schemaVersion: 2,
    activeProjectId,
    projects
  };
}

function normalizeProject(project, index = 0) {
  project ||= {};
  const meta = defaultMeta(project.meta || {});
  const name = project.name || meta.projectName || `Dự án ${index + 1}`;
  if (!meta.projectName) meta.projectName = name;
  const communes = Array.isArray(project.communes) ? project.communes : [];
  const normalizedCommunes = communes.length
    ? communes.map(normalizeCommune)
    : [createBlankCommune("Xã/Khu vực 1", "KV1")];
  return {
    id: project.id || projectIdFromName(name, index),
    name,
    meta,
    notes: defaultNotes(project.notes || {}),
    communes: normalizedCommunes,
    audit: Array.isArray(project.audit) ? project.audit : [],
    updatedAt: project.updatedAt || project.updated_at || meta.lastSaved || "",
    createdBy: project.createdBy || project.created_by || ""
  };
}

function defaultMeta(overrides = {}) {
  return {
    agency: "Trung tâm phát triển quỹ đất khu vực Bắc Bình",
    projectName: "Báo cáo kết quả thực hiện dự án",
    reportPeriod: { from: "2026-07-01", to: "2026-07-30" },
    sourceUrl: WORKBOOK_URL,
    ...overrides,
    reportPeriod: {
      from: "2026-07-01",
      to: "2026-07-30",
      ...(overrides.reportPeriod || {})
    }
  };
}

function defaultNotes(overrides = {}) {
  return {
    difficulties: "",
    recommendations: "",
    nextPlan: "",
    ...overrides
  };
}

function syncUiToProject() {
  if (!db?.projects?.length) return;
  const project = currentProject();
  db.activeProjectId = project.id;
  ui.projectId = project.id;
  if (!project.communes.length) project.communes.push(createBlankCommune("Xã/Khu vực 1", "KV1"));
  if (!project.communes.some(commune => commune.id === ui.communeId)) {
    ui.communeId = project.communes[0]?.id || "";
  }
  if (ui.reportScope !== "summary" && !project.communes.some(commune => commune.id === ui.reportScope)) {
    ui.reportScope = "summary";
  }
}

function currentProject() {
  if (!db?.projects?.length) return null;
  return db.projects.find(project => project.id === ui.projectId)
    || db.projects.find(project => project.id === db.activeProjectId)
    || db.projects[0];
}

function projectMeta() {
  const project = currentProject();
  if (!project) return defaultMeta();
  project.meta = defaultMeta(project.meta || {});
  return project.meta;
}

function projectNotes() {
  const project = currentProject();
  if (!project) return defaultNotes();
  project.notes = defaultNotes(project.notes || {});
  return project.notes;
}

function projectCommunes() {
  const project = currentProject();
  return project?.communes || [];
}

function projectDisplayName(project) {
  return project?.name || project?.meta?.projectName || "Dự án chưa đặt tên";
}

function createBlankCommune(name = "Xã/Khu vực 1", id = "KV1") {
  return normalizeCommune({
    id,
    name,
    positionNote: "",
    stageRounds: {},
    records: []
  });
}

function nextProjectId(name) {
  const base = projectIdFromName(name, db.projects.length);
  let id = base;
  let index = 1;
  const used = new Set(db.projects.map(project => project.id));
  while (used.has(id)) {
    index += 1;
    id = `${base}${index}`;
  }
  return id;
}

function projectIdFromName(value, index = 0) {
  return String(value || `DUAN${index + 1}`)
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/Đ/g, "D")
    .toUpperCase()
    .replace(/[^A-Z0-9]+/g, "")
    .slice(0, 14) || `DUAN${index + 1}`;
}

function uniqueProjectId(id, name, usedIds, index = 0) {
  const base = String(id || "").trim() || projectIdFromName(name, index);
  let candidate = base;
  let suffix = 1;
  while (usedIds.has(candidate)) {
    suffix += 1;
    candidate = `${base}${suffix}`;
  }
  usedIds.add(candidate);
  return candidate;
}

function normalizeCommune(commune) {
  const rawRecords = Array.isArray(commune.records) ? commune.records : [];
  const stageRounds = {};

  STAGES.forEach(stage => {
    const importedRounds = normalizeRoundMetaList(commune.stageRounds?.[stage.id]);
    const recordRoundCount = rawRecords.reduce((max, record) => {
      const rounds = record.stages?.[stage.id]?.rounds;
      return Math.max(max, Array.isArray(rounds) ? rounds.length : 0);
    }, 0);
    const roundCount = Math.max(stage.defaultRounds || 1, importedRounds.length, recordRoundCount);
    stageRounds[stage.id] = {
      rounds: Array.from({ length: roundCount }, (_, index) => ({
        document: importedRounds[index]?.document || firstRecordRoundDocument(rawRecords, stage.id, index) || ""
      }))
    };
  });

  const stageRoundCounts = Object.fromEntries(
    STAGES.map(stage => [stage.id, stageRounds[stage.id].rounds.length])
  );

  return {
    id: commune.id,
    name: commune.name || COMMUNE_NAMES[commune.id] || commune.id,
    positionNote: commune.positionNote || "",
    stageRounds,
    records: rawRecords.map(record => normalizeRecord(record, stageRoundCounts))
  };
}

function normalizeRoundMetaList(stageRoundData) {
  const rounds = Array.isArray(stageRoundData?.rounds)
    ? stageRoundData.rounds
    : Array.isArray(stageRoundData)
      ? stageRoundData
      : [];
  return rounds.map(round => ({
    document: round?.document || ""
  }));
}

function firstRecordRoundDocument(records, stageId, roundIndex) {
  for (const record of records) {
    const documentText = record.stages?.[stageId]?.rounds?.[roundIndex]?.document;
    if (documentText) return documentText;
  }
  return "";
}

function normalizeRecord(record, stageRoundCounts = {}) {
  const original = {
    mapSheet: "",
    parcelNo: "",
    landUser: "",
    address: "",
    recoveryNotice: "",
    area: "",
    landType: "",
    ...(record.original || {})
  };
  const adjusted = {
    landUser: "",
    address: "",
    adjustedNotice: "",
    area: "",
    landType: "",
    ...(record.adjusted || {})
  };
  const rawParcels = Array.isArray(record.parcels) && record.parcels.length
    ? record.parcels
    : [{
      original: {
        mapSheet: original.mapSheet,
        parcelNo: original.parcelNo,
        recoveryNotice: original.recoveryNotice,
        area: original.area,
        landType: original.landType
      },
      adjusted: {
        adjustedNotice: adjusted.adjustedNotice,
        area: adjusted.area,
        landType: adjusted.landType
      }
    }];
  const normalizedParcels = rawParcels.map(normalizeParcel);

  const next = {
    id: record.id || crypto.randomUUID(),
    type: record.type === "organization" ? "organization" : "household",
    original,
    adjusted,
    parcels: normalizedParcels,
    stages: {},
    recoveryDecision: {
      cases: "",
      document: "",
      area: "",
      ...(record.recoveryDecision || {}),
      parcels: normalizeAreaParcelList(record.recoveryDecision, normalizedParcels)
    },
    handoverPaid: {
      cases: "",
      area: "",
      time: "",
      ...(record.handoverPaid || {}),
      parcels: normalizeAreaParcelList(record.handoverPaid, normalizedParcels)
    },
    handoverEarly: {
      cases: "",
      area: "",
      time: "",
      ...(record.handoverEarly || {}),
      parcels: normalizeAreaParcelList(record.handoverEarly, normalizedParcels)
    },
    remarks: record.remarks || ""
  };

  STAGES.forEach(stage => {
    const existing = record.stages?.[stage.id] || {};
    const roundCount = Math.max(stageRoundCounts[stage.id] || 0, Array.isArray(existing.rounds) ? existing.rounds.length : 0, stage.defaultRounds || 1);
    const rounds = Array.from({ length: roundCount }, (_, index) => normalizeStageRound(existing.rounds?.[index], normalizedParcels));
    next.stages[stage.id] = {
      rounds,
      note: existing.note || ""
    };
  });

  return next;
}

function normalizeParcel(parcel) {
  return {
    id: parcel.id || crypto.randomUUID(),
    original: {
      mapSheet: "",
      parcelNo: "",
      recoveryNotice: "",
      area: "",
      landType: "",
      ...(parcel.original || {})
    },
    adjusted: {
      adjustedNotice: "",
      area: "",
      landType: "",
      ...(parcel.adjusted || {})
    }
  };
}

function normalizeStageRound(round, recordParcels = []) {
  const existing = round || {};
  const existingParcels = Array.isArray(existing.parcels) ? existing.parcels : [];
  const parcelList = parcelSlots(recordParcels);
  const splitArea = shouldSplitAggregateParcelValue(existing.area, existingParcels, "area", parcelList);
  const splitCost = (splitArea || !existingParcels.length) && shouldSplitAggregateParcelValue(existing.cost, existingParcels, "cost", parcelList, false);
  const splitAreaValues = splitArea ? splitTotalByParcels(existing.area, parcelList) : null;
  const splitCostValues = splitCost ? splitTotalByParcels(existing.cost, parcelList) : null;
  const parcels = Array.from({ length: parcelList.length }, (_, index) => ({
    area: splitAreaValues?.[index] ?? existingParcels[index]?.area ?? (index === 0 ? existing.area ?? "" : ""),
    cost: splitCostValues?.[index] ?? existingParcels[index]?.cost ?? (index === 0 ? existing.cost ?? "" : "")
  }));
  return {
    cases: existing.cases || "",
    area: existing.area || "",
    cost: existing.cost || "",
    document: existing.document || "",
    parcels
  };
}

function normalizeAreaParcelList(section, recordParcels = []) {
  const existing = section || {};
  const existingParcels = Array.isArray(existing.parcels) ? existing.parcels : [];
  const parcelList = parcelSlots(recordParcels);
  const splitArea = shouldSplitAggregateParcelValue(existing.area, existingParcels, "area", parcelList);
  const splitAreaValues = splitArea ? splitTotalByParcels(existing.area, parcelList) : null;
  return Array.from({ length: parcelList.length }, (_, index) => ({
    area: splitAreaValues?.[index] ?? existingParcels[index]?.area ?? (index === 0 ? existing.area ?? "" : "")
  }));
}

function parcelSlots(recordParcels = []) {
  if (Array.isArray(recordParcels)) return recordParcels;
  const count = Math.max(0, Number(recordParcels) || 0);
  return Array.from({ length: count }, () => ({}));
}

function shouldSplitAggregateParcelValue(total, existingParcels, field, recordParcels, compareFirstParcelArea = true) {
  const parcelList = parcelSlots(recordParcels);
  if (parcelList.length <= 1 || !hasText(total) || !safeNum(total)) return false;
  const filled = existingParcels
    .map((parcel, index) => ({ index, value: parcel?.[field] }))
    .filter(item => hasText(item.value) || safeNum(item.value));
  if (!filled.length) return true;
  if (filled.length !== 1 || filled[0].index !== 0 || !nearlyEqual(filled[0].value, total)) return false;
  if (!compareFirstParcelArea) return true;
  const firstParcelArea = parcelBaseArea(parcelList[0]);
  const allParcelArea = parcelList.reduce((sum, parcel) => sum + parcelBaseArea(parcel), 0);
  const totalNumber = safeNum(total);
  return totalNumber > firstParcelArea + 0.01 || nearlyEqual(totalNumber, allParcelArea);
}

function splitTotalByParcels(total, recordParcels = []) {
  const parcelList = parcelSlots(recordParcels);
  const totalNumber = safeNum(total);
  if (!parcelList.length || !totalNumber) return parcelList.map(() => "");
  const weights = parcelList.map(parcelBaseArea);
  const weightTotal = weights.reduce((sum, value) => sum + value, 0);
  if (!weightTotal) return parcelList.map((_, index) => (index === 0 ? total : ""));
  let runningTotal = 0;
  return weights.map((weight, index) => {
    if (index === weights.length - 1) {
      const lastValue = roundToTwoDecimals(totalNumber - runningTotal);
      return lastValue || "";
    }
    const value = roundToTwoDecimals(totalNumber * weight / weightTotal);
    runningTotal += value;
    return value || "";
  });
}

function parcelBaseArea(parcel) {
  return safeNum(parcel.adjusted?.area) || safeNum(parcel.original?.area);
}

function roundToTwoDecimals(value) {
  return Math.round((value + Number.EPSILON) * 100) / 100;
}

function nearlyEqual(a, b) {
  return Math.abs(safeNum(a) - safeNum(b)) < 0.01;
}

function blankParcel() {
  return normalizeParcel({});
}

function newRecord(type = "household", commune = currentCommune()) {
  const stageRoundCounts = Object.fromEntries(
    STAGES.map(stage => [stage.id, ensureCommuneStage(commune, stage.id).rounds.length])
  );
  return normalizeRecord({
    id: crypto.randomUUID(),
    type,
    original: {},
    adjusted: {},
    stages: {}
  }, stageRoundCounts);
}

      <section class="auth-panel">
        <div>
          <h1>Giải phóng mặt bằng Bắc Bình</h1>
          <p>Đăng nhập nội bộ để làm việc trên các dự án được phân quyền.</p>
        </div>
        <div class="auth-tabs">
          <button class="${!isSignup ? "active" : ""}" data-action="auth-mode" data-mode="login">Đăng nhập</button>
          <button class="${isSignup ? "active" : ""}" data-action="auth-mode" data-mode="signup">Tạo tài khoản</button>
        </div>
        <div class="auth-fields">
          <label>
            <span>Email</span>
            <input id="authEmail" type="email" autocomplete="email">
          </label>
          <label>
            <span>Mật khẩu</span>
            <input id="authPassword" type="password" autocomplete="${isSignup ? "new-password" : "current-password"}">
          </label>
          ${isSignup ? `
            <label>
              <span>Họ tên</span>
              <input id="authName" autocomplete="name">

        </div>

function renderNoProjectShell() {
  app.innerHTML = `
    <main class="auth-screen">
      <section class="auth-panel">
        <div>
          <h1>Chưa có dự án được phân quyền</h1>
          <p>${canCreateProjects() ? "Tài khoản này có quyền tạo dự án đầu tiên." : "Tài khoản này cần được tài khoản chủ thêm vào một dự án trước khi nhập liệu."}</p>
        </div>
        <div class="auth-actions">
          ${canCreateProjects() ? `<button class="btn primary" data-action="add-project"><i data-lucide="folder-plus"></i><span>Tạo dự án</span></button>` : ""}
          <button class="btn" data-action="auth-logout"><i data-lucide="log-out"></i><span>Đăng xuất</span></button>
        </div>
      </section>
    </main>
  `;
  refreshIcons();
}

function authStatus() {
  if (store.mode !== "supabase") {
    return `<span class="status auth-status"><i data-lucide="hard-drive"></i><span>Lưu local</span></span>`;
  }
  const role = currentProjectRole();
  return `
    <span class="status auth-status"><i data-lucide="user-round"></i><span>${escapeHtml(store.user?.email || "")}${role ? ` - ${roleLabel(role)}` : ""}</span></span>
    <button class="btn" data-action="auth-logout"><i data-lucide="log-out"></i><span>Đăng xuất</span></button>
  `;
}

function canCreateProjects() {
  return store.mode !== "supabase" || Boolean(store.profile?.is_app_admin);
}

function currentProjectRole() {
  return projectRole(currentProject()?.id);
}

function projectRole(projectId) {
  if (store.mode !== "supabase") return "local";
  if (!projectId) return "";
  return store.projectRoles[projectId] || "";
}

function canManageProject(projectId) {
  if (store.mode !== "supabase") return true;
  const role = projectRole(projectId);
  return store.profile?.is_app_admin || role === "owner" || role === "admin";
}

function canEditCurrentProject() {
  if (store.mode !== "supabase") return true;
  return ["admin", "owner", "editor"].includes(currentProjectRole());
}

function roleLabel(role) {
  if (role === "admin") return "Tài khoản chủ";
  if (role === "owner") return "Chủ dự án";
  if (role === "editor") return "Nhập liệu";
  if (role === "local") return "Local";
  return "Chưa phân quyền";
}

function requireProjectEdit() {
  if (canEditCurrentProject()) return true;
  alert("Tài khoản này chưa có quyền nhập liệu/chỉnh sửa dự án hiện tại.");
  return false;
}

function exportProjectState(project) {
  return {
    id: project.id,
    name: project.name,
    meta: project.meta,
    notes: project.notes,
    communes: project.communes,
    audit: project.audit || []
  };
}

function navButton(view, icon, label) {
  return `
    <button class="${ui.view === view ? "active" : ""}" data-view="${view}">
      <i data-lucide="${icon}"></i>
      <span>${label}</span>
    </button>
  `;
}

function viewTitle() {
  if (ui.view === "update") return `Cập nhật số liệu - ${currentCommune()?.name || ""}`;
  if (ui.view === "report") return "Báo cáo kết quả thực hiện dự án";
  if (ui.view === "formulas") return "Đầu mục công việc và công thức";
  return projectMeta().projectName || "Báo cáo giải phóng mặt bằng";
}

function periodText() {
  const meta = projectMeta();
  const from = formatDate(meta.reportPeriod?.from);
  const to = formatDate(meta.reportPeriod?.to);
  return `Kỳ báo cáo: ${from} đến ${to}`;
}

function renderContent() {
  if (ui.view === "update") return renderUpdateView();
  if (ui.view === "report") return renderReportView();
  if (ui.view === "formulas") return renderFormulaView();
  return renderDashboard();
}

function renderDashboard() {
  const totals = aggregateAll();
  const progress = buildProgressRows(totals);
  const communes = projectCommunes();
  return `
    ${renderProjectOverview()}
    <section class="metrics">
      ${metric("Tổng sau kiểm đếm", formatNumber(totals.adjusted.cases), `${formatArea(totals.adjusted.area)} m2`)}
      ${metric("Quyết định phương án bồi thường, hỗ trợ, tái định cư", formatNumber(totals.stages.planDecision.cases), `${formatMoney(totals.stages.planDecision.cost)} đồng`)}
      ${metric("Đã chi trả tiền bồi thường, hỗ trợ", formatNumber(totals.stages.payment.cases), `${formatMoney(totals.stages.payment.cost)} đồng`)}
      ${metric("Đã bàn giao mặt bằng", formatNumber(totals.handover.total.cases), `${formatArea(totals.handover.total.area)} m2`)}
    </section>
    <section class="panel">
      <div class="panel-header">
        <div>
          <h3>Tiến độ lũy kế</h3>
        </div>
      </div>
      <div class="panel-body">
        <div class="progress-list">
          ${progress.map(row => progressRow(row)).join("")}
        </div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-header">
        <div>
          <h3>Tổng hợp theo xã</h3>
        </div>
      </div>
      <div class="panel-body">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Xã/khu vực</th>
                <th>Tổng sau kiểm đếm</th>
                <th>Diện tích sau kiểm đếm</th>
                <th>Kiểm đếm</th>
                <th>Quyết định phương án bồi thường, hỗ trợ, tái định cư</th>
                <th>Chi trả tiền bồi thường, hỗ trợ</th>
                <th>Quyết định thu hồi đất</th>
                <th>Bàn giao mặt bằng</th>
              </tr>
            </thead>
            <tbody>
              ${communes.map(commune => {
                const t = communeTotals(commune);
                return `
                  <tr>
                    <td><strong>${escapeHtml(commune.name)}</strong></td>
                    <td>${formatNumber(t.adjusted.cases)}</td>
                    <td>${formatArea(t.adjusted.area)}</td>
                    <td>${formatNumber(t.stages.inventory.cases)} / ${formatArea(t.stages.inventory.area)}</td>
                    <td>${formatNumber(t.stages.planDecision.cases)} / ${formatArea(t.stages.planDecision.area)}</td>
                    <td>${formatNumber(t.stages.payment.cases)} / ${formatMoney(t.stages.payment.cost)}</td>
                    <td>${formatNumber(t.recoveryDecision.cases)} / ${formatArea(t.recoveryDecision.area)}</td>
                    <td>${formatNumber(t.handover.total.cases)} / ${formatArea(t.handover.total.area)}</td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      </div>
    </section>
  `;
}

function renderProjectOverview() {
  const projects = db.projects || [];
  return `
    <section class="panel project-overview no-print">
      <div class="panel-header">
        <div>
          <h3>Tất cả dự án</h3>
          <p>${formatNumber(projects.length)} dự án đang quản lý</p>
        </div>
        <div class="toolbar">
          <button class="btn primary" data-action="add-project" ${canCreateProjects() ? "" : "disabled"}><i data-lucide="folder-plus"></i><span>Thêm dự án</span></button>
        </div>
      </div>
      <div class="panel-body">
        <div class="project-grid">
          ${projects.map(project => renderProjectCard(project)).join("")}
        </div>
      </div>
    </section>
    ${renderProjectAccessPanel()}
  `;
}

function renderProjectCard(project) {
  const isActive = project.id === currentProject()?.id;
  const communeCount = project.communes?.length || 0;
  const recordCount = (project.communes || []).reduce((sum, commune) => sum + commune.records.length, 0);
  const role = projectRole(project.id);
  const updated = project.updatedAt ? `Cập nhật ${new Date(project.updatedAt).toLocaleString("vi-VN")}` : "Dữ liệu local";
  return `
    <article class="project-card ${isActive ? "active" : ""}">
      <div class="project-card-head">
        <div>
          <h4>${escapeHtml(projectDisplayName(project))}</h4>
          <p>${escapeHtml(updated)}</p>
        </div>
        <span class="pill ${isActive ? "green" : ""}">${isActive ? "Đang mở" : roleLabel(role)}</span>
      </div>
      <div class="project-card-stats">
        <span><strong>${formatNumber(communeCount)}</strong> xã/khu vực</span>
        <span><strong>${formatNumber(recordCount)}</strong> hồ sơ</span>
      </div>
      <div class="project-card-actions">
        <button class="btn" data-action="open-project" data-project="${escapeAttr(project.id)}"><i data-lucide="folder-open"></i><span>Mở</span></button>
        <button class="btn" data-action="rename-project" data-project="${escapeAttr(project.id)}" ${canManageProject(project.id) ? "" : "disabled"}><i data-lucide="pencil"></i><span>Đổi tên</span></button>
        <button class="btn danger" data-action="delete-project" data-project="${escapeAttr(project.id)}" ${canManageProject(project.id) ? "" : "disabled"}><i data-lucide="trash-2"></i></button>
      </div>
    </article>
  `;
}

function renderProjectAccessPanel() {
  if (store.mode !== "supabase") return "";
  const project = currentProject();
  if (!project) return "";
  const canManage = canManageProject(project.id);
  const members = store.projectMembers[project.id] || [];
  return `
    <section class="panel project-access-panel no-print">
      <div class="panel-header">
        <div>
          <h3>Phân quyền dự án hiện tại</h3>
          <p>${canManage ? "Thêm tài khoản nội bộ vào dự án để cùng nhập liệu." : "Chỉ chủ dự án mới phân quyền tài khoản khác."}</p>
        </div>
      </div>
      <div class="panel-body">
        ${canManage ? `
          <div class="access-form">
            <div class="field">
              <label>Email tài khoản nội bộ</label>
              <input data-access-email placeholder="email@coquan.gov.vn">
            </div>
            <div class="field">
              <label>Quyền</label>
              <select data-access-role>
                <option value="editor">Nhập liệu và chỉnh sửa</option>
                <option value="owner">Chủ dự án phụ</option>
              </select>
            </div>
            <button class="btn primary" data-action="grant-project-access"><i data-lucide="user-plus"></i><span>Thêm vào dự án</span></button>
          </div>
        ` : ""}
        <div class="member-list">
          ${members.length ? members.map(member => `
            <div class="member-row">
              <span>
                <strong>${escapeHtml(member.profiles?.display_name || member.profiles?.email || member.user_id)}</strong>
                <small>${escapeHtml(member.profiles?.email || "")}</small>
              </span>
              <span class="pill">${roleLabel(member.role)}</span>
              ${canManage && member.user_id !== store.user?.id ? `<button class="btn icon danger" title="Gỡ khỏi dự án" data-action="remove-project-access" data-project="${escapeAttr(project.id)}" data-user="${escapeAttr(member.user_id)}"><i data-lucide="user-minus"></i></button>` : ""}
            </div>
          `).join("") : emptyState("Chưa có thành viên nào ngoài tài khoản chủ.")}
        </div>
      </div>
    </section>
  `;
}

function metric(label, value, detail) {
  return `
    <div class="metric">
      <label>${escapeHtml(label)}</label>
      <strong>${value}</strong>
      <span>${escapeHtml(detail)}</span>
    </div>
  `;
}

function progressRow(row) {
  const percent = clamp(row.percent, 0, 100);
  const pillClass = percent >= 80 ? "green" : percent >= 40 ? "amber" : "red";
  return `
    <div class="progress-row">
      <div>
        <strong>${escapeHtml(row.name)}</strong>
        <div class="muted">${formatNumber(row.done.cases)} trường hợp / ${formatArea(row.done.area)} m2</div>
      </div>
      <div class="bar" aria-label="${percent.toFixed(0)}%">
        <span style="width:${percent}%"></span>
      </div>
      <span class="pill ${pillClass}">${formatPercent(percent)}</span>
    </div>
  `;
}

function renderUpdateView() {
  const commune = currentCommune();
  const communes = projectCommunes();
  const stageTabs = [
    { id: "measurement", name: "Đo đạc và quy chủ" },
    ...STAGES.map(stage => ({ id: stage.id, name: `${stage.no}. ${stage.shortName}` })),
    { id: "recoveryDecision", name: "9. Quyết định thu hồi đất" },
    { id: "handover", name: "10. Bàn giao mặt bằng" },
    { id: "notHandover", name: "11. Chưa giao mặt bằng" },
    { id: "remarks", name: "12. Ghi chú" }
  ];
  return `
    <section class="panel no-print">
      <div class="panel-header">
        <div>
          <h3>${escapeHtml(commune.name)}</h3>
          <p>${formatNumber(commune.records.length)} hồ sơ đang quản lý</p>
        </div>
        <div class="toolbar">
          <button class="btn" data-action="add-commune"><i data-lucide="map-plus"></i><span>Thêm xã/khu vực</span></button>
          <button class="btn" data-action="rename-commune"><i data-lucide="pencil"></i><span>Đổi tên xã/khu vực</span></button>
          <button class="btn danger" data-action="delete-commune"><i data-lucide="trash-2"></i><span>Xóa xã/khu vực</span></button>
          <button class="btn primary" data-action="add-record" data-type="household"><i data-lucide="user-plus"></i><span>Thêm hộ</span></button>
          <button class="btn" data-action="add-record" data-type="organization"><i data-lucide="building-2"></i><span>Thêm tổ chức</span></button>
        </div>
      </div>
      <div class="panel-body">
        <div class="grid-3">
          <div class="field">
            <label>Tìm kiếm</label>
            <input value="${escapeAttr(ui.search)}" data-action="search" placeholder="Tên, thửa đất, địa chỉ">
          </div>
          <div class="field">
            <label>Loại hồ sơ</label>
            <select data-action="type-filter">
              <option value="all" ${ui.type === "all" ? "selected" : ""}>Tất cả</option>
              <option value="household" ${ui.type === "household" ? "selected" : ""}>Hộ gia đình, cá nhân</option>
              <option value="organization" ${ui.type === "organization" ? "selected" : ""}>Tổ chức</option>
            </select>
          </div>
          <div class="field">
            <label>Xã/khu vực</label>
            <select data-action="commune-select">
              ${communes.map(c => `<option value="${c.id}" ${c.id === commune.id ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="tabs" style="margin-top:14px">
          ${stageTabs.map(tab => `
            <button class="tab ${ui.stageId === tab.id ? "active" : ""}" data-stage-tab="${tab.id}">
              ${escapeHtml(tab.name)}
            </button>
          `).join("")}
        </div>
      </div>
    </section>
    ${renderCurrentEntryTable(commune)}
  `;
}

function renderCurrentEntryTable(commune) {
  if (ui.stageId === "measurement") return renderMeasurementTable(commune);
  if (ui.stageId === "recoveryDecision") return renderRecoveryDecisionTable(commune);
  if (ui.stageId === "handover") return renderHandoverTable(commune);
  if (ui.stageId === "notHandover") return renderNotHandoverTable(commune);
  if (ui.stageId === "remarks") return renderRemarksTable(commune);
  const stage = STAGES.find(item => item.id === ui.stageId) || STAGES[0];
  return renderStageTable(commune, stage);
}

function visibleRecords(commune) {
  const search = normalizeText(ui.search);
  return commune.records.filter(record => {
    if (ui.type !== "all" && record.type !== ui.type) return false;
    if (!search) return true;
    const haystack = normalizeText([
      record.original.landUser,
      record.adjusted.landUser,
      record.original.address,
      record.adjusted.address,
      record.remarks,
      ...record.parcels.flatMap(parcel => [
        parcel.original.mapSheet,
        parcel.original.parcelNo,
        parcel.original.recoveryNotice,
        parcel.original.landType,
        parcel.adjusted.adjustedNotice,
        parcel.adjusted.landType
      ])
    ].join(" "));
    return haystack.includes(search);
  });
}

function renderMeasurementTable(commune) {
  const records = visibleRecords(commune);
  return `
    <section class="panel">
      <div class="panel-header">
        <div>
          <h3>I. Số liệu đo đạc, quy chủ và điều chỉnh sau kiểm đếm</h3>
        </div>
      </div>
      <div class="panel-body">
        ${records.length ? `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="sticky-col">Hồ sơ / trường hợp</th>
                  <th>Loại</th>
                  <th>Tên chủ sử dụng đất gốc</th>
                  <th>Địa chỉ gốc</th>
                  <th>Địa chỉ điều chỉnh</th>
                  <th>Số thửa</th>
                  <th>Tổng diện tích gốc</th>
                  <th>Tổng diện tích sau kiểm đếm</th>
                  <th>Ghi chú</th>
                  <th class="small no-print"></th>
                </tr>
              </thead>
              <tbody>
                ${records.map(record => measurementRow(record)).join("")}
              </tbody>
            </table>
          </div>
        ` : emptyState("Chưa có hồ sơ phù hợp bộ lọc.")}
      </div>
    </section>
  `;
}

function measurementRow(record) {
  const originalArea = recordArea(record, "original");
  const adjustedArea = recordArea(record, "adjusted");
  return `
    <tr class="case-row">
      <td class="sticky-col">
        <div class="case-editor">
          <label>Chủ sau kiểm đếm</label>
          ${input(record, "adjusted.landUser", record.adjusted.landUser, "Họ và tên")}
          <div class="muted">Mã hồ sơ: ${escapeHtml(record.id)}</div>
        </div>
      </td>
      <td>
        <select data-record="${record.id}" data-path="type">
          <option value="household" ${record.type === "household" ? "selected" : ""}>Hộ</option>
          <option value="organization" ${record.type === "organization" ? "selected" : ""}>Tổ chức</option>
        </select>
      </td>
      <td>${input(record, "original.landUser", record.original.landUser, "Tên người sử dụng")}</td>
      <td>${input(record, "original.address", record.original.address)}</td>
      <td>${input(record, "adjusted.address", record.adjusted.address)}</td>
      <td><strong>${formatNumber(record.parcels.length)}</strong></td>
      <td>${formatArea(originalArea)}</td>
      <td>${formatArea(adjustedArea)}</td>
      <td>${textarea(record, "remarks", record.remarks)}</td>
      <td class="small no-print">
        <div class="row-actions">
          <button class="btn icon" title="Thêm thửa đất" data-action="add-parcel" data-record="${record.id}"><i data-lucide="copy-plus"></i></button>
          <button class="btn icon danger" title="Xóa hồ sơ" data-action="delete-record" data-record="${record.id}"><i data-lucide="trash-2"></i></button>
        </div>
      </td>
    </tr>
    <tr class="parcel-detail-row">
      <td colspan="10">
        ${renderParcelTable(record)}
      </td>
    </tr>
  `;
}

function renderParcelTable(record) {
  return `
    <div class="parcel-box">
      <div class="parcel-box-head">
        <strong>Danh sách thửa đất của trường hợp này</strong>
        <button class="btn no-print" data-action="add-parcel" data-record="${record.id}">
          <i data-lucide="plus"></i>
          <span>Thêm thửa</span>
        </button>
      </div>
      <div class="table-wrap parcel-table-wrap">
        <table class="parcel-table">
          <thead>
            <tr>
              <th>STT</th>
              <th>Tờ bản đồ</th>
              <th>Thửa đất</th>
              <th>Thông báo thu hồi đất</th>
              <th>Diện tích gốc</th>
              <th>Loại đất gốc</th>
              <th>Thông báo điều chỉnh</th>
              <th>Diện tích sau kiểm đếm</th>
              <th>Loại đất điều chỉnh</th>
              <th class="small no-print"></th>
            </tr>
          </thead>
          <tbody>
            ${record.parcels.map((parcel, index) => parcelRow(record, parcel, index)).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function parcelRow(record, parcel, index) {
  const canDelete = record.parcels.length > 1;
  return `
    <tr>
      <td>${index + 1}</td>
      <td>${input(record, `parcels.${index}.original.mapSheet`, parcel.original.mapSheet)}</td>
      <td>${input(record, `parcels.${index}.original.parcelNo`, parcel.original.parcelNo)}</td>
      <td>${input(record, `parcels.${index}.original.recoveryNotice`, parcel.original.recoveryNotice)}</td>
      <td>${numberInput(record, `parcels.${index}.original.area`, parcel.original.area)}</td>
      <td>${input(record, `parcels.${index}.original.landType`, parcel.original.landType)}</td>
      <td>${input(record, `parcels.${index}.adjusted.adjustedNotice`, parcel.adjusted.adjustedNotice)}</td>
      <td>${numberInput(record, `parcels.${index}.adjusted.area`, parcel.adjusted.area)}</td>
      <td>${input(record, `parcels.${index}.adjusted.landType`, parcel.adjusted.landType)}</td>
      <td class="small no-print">
        ${canDelete ? `<button class="btn icon danger" title="Xóa thửa đất" data-action="delete-parcel" data-record="${record.id}" data-parcel-index="${index}"><i data-lucide="trash-2"></i></button>` : ""}
      </td>
    </tr>
  `;
}

function renderStageTable(commune, stage) {
  const records = visibleRecords(commune);
  const stageMeta = ensureCommuneStage(commune, stage.id);
  records.forEach(record => ensureRecordStageLength(record, stage.id, stageMeta.rounds.length));
  const totals = stageRoundTotals(records, stage.id, stageMeta.rounds.length);
  const roundColumnCount = stage.hasCost ? 3 : 2;
  const tableColumnCount = 1 + (stageMeta.rounds.length * roundColumnCount) + 2 + (stage.hasCost ? 1 : 0) + 1;
  return `
    <section class="panel">
      <div class="panel-header">
        <div>
          <h3>${stage.no}. ${escapeHtml(stage.name)}</h3>
          <p>Tổng: ${formatNumber(totals.total.cases)} trường hợp, ${formatArea(totals.total.area)} m2${stage.hasCost ? `, ${formatMoney(totals.total.cost)} đồng` : ""}.</p>
        </div>
      </div>
      <div class="panel-body">
        <div class="toolbar no-print" style="margin-bottom:12px">
          <button class="btn primary" data-action="add-stage-round" data-stage="${stage.id}">
            <i data-lucide="plus"></i>
            <span>Thêm ${stage.unit.toLowerCase()}</span>
          </button>
        </div>
        <div class="table-wrap">
          <table class="stage-grid">
            <thead>
              <tr>
                <th class="sticky-col" rowspan="2">Hồ sơ</th>
                ${stageMeta.rounds.map((round, index) => `
                  <th class="group" colspan="${roundColumnCount}">
                    <div class="round-head">
                      <div class="round-title">
                        <span>${stage.unit} ${index + 1}</span>
                        ${stageMeta.rounds.length > 1 ? `<button class="btn icon danger no-print" title="Xóa ${stage.unit.toLowerCase()} này" data-action="delete-stage-round" data-stage="${stage.id}" data-round-index="${index}"><i data-lucide="trash-2"></i></button>` : ""}
                      </div>
                      <input value="${escapeAttr(round.document || "")}" placeholder="Văn bản, ngày tháng năm" data-stage-round-document="true" data-stage="${stage.id}" data-round-index="${index}">
                    </div>
                  </th>
                `).join("")}
                <th rowspan="2">Tổng trường hợp</th>
                <th rowspan="2">Tổng diện tích</th>
                ${stage.hasCost ? `<th rowspan="2">Tổng chi phí</th>` : ""}
                <th rowspan="2">Ghi chú</th>
              </tr>
              <tr>
                ${stageMeta.rounds.map(() => `
                  <th class="small">Trường hợp (tên người)</th>
                  <th class="small">Diện tích</th>
                  ${stage.hasCost ? `<th class="small">Chi phí</th>` : ""}
                `).join("")}
              </tr>
            </thead>
            <tbody>
              ${records.length ? records.map(record => stageRecordRow(record, stage, stageMeta.rounds.length)).join("") : `<tr><td class="empty" colspan="${tableColumnCount}">Chưa có hồ sơ phù hợp bộ lọc.</td></tr>`}
            </tbody>
            <tfoot>
              <tr>
                <th class="sticky-col">Tổng cộng</th>
                ${totals.rounds.map(round => `
                  <th>${formatNumber(round.cases)}</th>
                  <th>${formatArea(round.area)}</th>
                  ${stage.hasCost ? `<th>${formatMoney(round.cost)}</th>` : ""}
                `).join("")}
                <th>${formatNumber(totals.total.cases)}</th>
                <th>${formatArea(totals.total.area)}</th>
                ${stage.hasCost ? `<th>${formatMoney(totals.total.cost)}</th>` : ""}
                <th></th>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </section>
  `;
}

function stageRecordRow(record, stage, roundCount) {
  ensureRecordStageLength(record, stage.id, roundCount);
  const stageData = record.stages[stage.id];
  const total = totalRounds(stageData.rounds);
  return `
    <tr>
      <td class="sticky-col">
        <strong>${escapeHtml(displayOwner(record))}</strong>
        <div class="muted">${record.type === "organization" ? "Tổ chức" : "Hộ"} - ${escapeHtml(parcelSummary(record))}</div>
      </td>
      ${stageData.rounds.map((round, index) => `
        <td>${input(record, `stages.${stage.id}.rounds.${index}.cases`, round.cases, "Tên người")}</td>
        <td>${renderRoundParcelInputs(record, stage, index, round, "area")}</td>
        ${stage.hasCost ? `<td>${renderRoundParcelInputs(record, stage, index, round, "cost")}</td>` : ""}
      `).join("")}
      <td>${formatNumber(total.cases)}</td>
      <td>${formatArea(total.area)}</td>
      ${stage.hasCost ? `<td>${formatMoney(total.cost)}</td>` : ""}
      <td>${input(record, `stages.${stage.id}.note`, stageData.note)}</td>
    </tr>
  `;
}

function renderRoundParcelInputs(record, stage, roundIndex, round, field) {
  const parcels = record.parcels || [];
  const total = roundParcelTotal(round);
  const value = field === "cost" ? total.cost : total.area;
  const label = field === "cost" ? "Tổng chi phí" : "Tổng diện tích";
  return `
    <div class="round-parcel-list">
      ${parcels.map((parcel, parcelIndex) => `
        <label>
          <span>${escapeHtml(parcelLabel(parcel, parcelIndex))}</span>
          ${numberInput(record, `stages.${stage.id}.rounds.${roundIndex}.parcels.${parcelIndex}.${field}`, round.parcels?.[parcelIndex]?.[field] ?? "")}
        </label>
      `).join("")}
      <div class="round-parcel-total">${label}: ${field === "cost" ? formatMoney(value) : formatArea(value)}</div>
    </div>
  `;
}

function parcelLabel(parcel, index) {
  const map = parcel.original?.mapSheet || "";
  const no = parcel.original?.parcelNo || "";
  const suffix = [map, no].filter(Boolean).join("/");
  return `Thửa ${index + 1}${suffix ? ` (${suffix})` : ""}`;
}

function renderAreaParcelInputs(record, sectionKey) {
  const section = record[sectionKey] || {};
  const total = areaParcelTotal(section);
  return `
    <div class="round-parcel-list">
      ${(record.parcels || []).map((parcel, parcelIndex) => `
        <label>
          <span>${escapeHtml(parcelLabel(parcel, parcelIndex))}</span>
          ${numberInput(record, `${sectionKey}.parcels.${parcelIndex}.area`, section.parcels?.[parcelIndex]?.area ?? "")}
        </label>
      `).join("")}
      <div class="round-parcel-total">Tổng diện tích: ${formatArea(total.area)}</div>
    </div>
  `;
}

function renderRecoveryDecisionTable(commune) {
  const records = visibleRecords(commune);
  const totals = communeTotals(commune);
  return `
    <section class="panel">
      <div class="panel-header">
        <div>
          <h3>9. Tổng quyết định thu hồi đất</h3>
          <p>Tổng: ${formatNumber(totals.recoveryDecision.cases)} trường hợp, ${formatArea(totals.recoveryDecision.area)} m2.</p>
        </div>
      </div>
      <div class="panel-body">
        ${records.length ? `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="sticky-col">Hồ sơ</th>
                  <th>Quyết định thu hồi đất - trường hợp</th>
                  <th>Số quyết định, ngày tháng năm</th>
                  <th>Quyết định thu hồi đất - diện tích</th>
                </tr>
              </thead>
              <tbody>
                ${records.map(record => recoveryDecisionRow(record)).join("")}
              </tbody>
              <tfoot>
                <tr>
                  <th class="sticky-col">Tổng cộng</th>
                  <th>${formatNumber(totals.recoveryDecision.cases)}</th>
                  <th></th>
                  <th>${formatArea(totals.recoveryDecision.area)}</th>
                </tr>
              </tfoot>
            </table>
          </div>
        ` : emptyState("Chưa có hồ sơ phù hợp bộ lọc.")}
      </div>
    </section>
  `;
}

function recoveryDecisionRow(record) {
  return `

function notHandoverRow(record) {
  const plan = totalRounds(record.stages.planDecision.rounds);
  const paid = record.handoverPaid;
  const approvedPending = {
    cases: plan.cases - caseCount(paid.cases),
    area: plan.area - safeNum(paid.area)
  };
  const unapprovedPending = {
    cases: adjustedCase(record) - plan.cases,
    area: recordArea(record, "adjusted") - plan.area
  };
  const total = addTotals(approvedPending, unapprovedPending);
  return `
    <tr>
      <td class="sticky-col"><strong>${escapeHtml(displayOwner(record))}</strong><div class="muted">${record.type === "organization" ? "Tổ chức" : "Hộ"}</div></td>
      <td>${formatNumber(approvedPending.cases)}</td>

      <td>${formatNumber(unapprovedPending.cases)}</td>
      <td>${formatArea(unapprovedPending.area)}</td>
      <td>${formatNumber(total.cases)}</td>
      <td>${formatArea(total.area)}</td>
    </tr>
  `;
}

function renderReportScopeDashboard(title, communes, reportItems) {
  const totals = aggregateCommuneList(communes);
  const quantitativeItems = reportItems.filter(isQuantitativeReportItem);
  return `
    <div class="report-scope-dashboard">
      <div class="report-scope-heading">
        <h4>${escapeHtml(title)}</h4>
        <span>${formatNumber(communes.reduce((sum, commune) => sum + commune.records.length, 0))} hồ sơ, ${formatNumber(communes.length)} xã/khu vực</span>
      </div>
      <div class="metrics report-metrics">
        ${metric("Tổng dự án sau kiểm đếm", formatNumber(totals.adjusted.cases), `${formatArea(totals.adjusted.area)} m2`)}
        ${metric("Đã phê duyệt phương án", formatNumber(totals.stages.planDecision.cases), `${formatArea(totals.stages.planDecision.area)} m2`)}
        ${metric("Đã chi trả", formatNumber(totals.stages.payment.cases), `${formatMoney(totals.stages.payment.cost)} đồng`)}
        ${metric("Đã bàn giao mặt bằng", formatNumber(totals.handover.total.cases), `${formatArea(totals.handover.total.area)} m2`)}
      </div>
      <div class="dashboard-grid">
        ${quantitativeItems.map(item => renderDashboardCard(item, reportProgress(item, totals))).join("")}
      </div>
    </div>
  `;
}

function renderDashboardCard(item, progress) {
  const casePct = progress.casePercent;
  const areaPct = progress.areaPercent;
  const doneCost = safeNum(progress.done.cost);
  return `
    <article class="progress-card">
      <div>
        <strong>${escapeHtml(item.no)}. ${escapeHtml(item.title)}</strong>
        <span>${escapeHtml(progress.doneLabel)}: ${formatNumber(progress.done.cases)} trường hợp, ${formatArea(progress.done.area)} m2</span>
      </div>
      <div class="progress-meter">
        <label>Trường hợp ${formatPercent(casePct)}</label>
        <div class="bar"><span style="width:${clamp(casePct, 0, 100)}%"></span></div>
      </div>
      <div class="progress-meter">
        <label>Diện tích ${formatPercent(areaPct)}</label>
        <div class="bar"><span style="width:${clamp(areaPct, 0, 100)}%"></span></div>
      </div>
      <div class="progress-card-foot">
        <span>${escapeHtml(progress.ongoingLabel)}: ${formatNumber(progress.ongoing.cases)} trường hợp, ${formatArea(progress.ongoing.area)} m2</span>
        <span>${escapeHtml(progress.notStartedLabel)}: ${formatNumber(progress.notStarted.cases)} trường hợp, ${formatArea(progress.notStarted.area)} m2</span>
        ${doneCost ? `<span>Chi phí: ${formatMoney(doneCost)} đồng</span>` : ""}
      </div>
    </article>
  `;
}

function stageReportRows(item, commune, showCommuneColumn) {
  const stage = item.stage;
  const stageMeta = ensureCommuneStage(commune, stage.id);
  const totals = communeTotals(commune);
  const base = getTotalByRef(totals, item.baseRef);
  const totalBase = totals.adjusted;
  const roundTotals = stageRoundTotals(commune.records, stage.id, stageMeta.rounds.length);
  const ongoing = item.hasOngoing === false ? zeroTotal() : subtractTotals(base, roundTotals.total);
  const notStarted = subtractTotals(totalBase, roundTotals.total);
  const communeCell = showCommuneColumn ? `<td class="report-commune" rowspan="${stageMeta.rounds.length + 3}">${escapeHtml(commune.name)}</td>` : "";
  const rows = [
    `
      <tr class="summary-row">
        ${communeCell}
        <td><strong>${escapeHtml(item.doneLabel)}</strong></td>
        <td></td>
        <td>${formatNumber(roundTotals.total.cases)}</td>
        <td>${formatArea(roundTotals.total.area)}</td>
        ${stage.hasCost ? `<td>${formatMoney(roundTotals.total.cost)}</td>` : ""}
        <td>${formatPercent(ratio(roundTotals.total.cases, base.cases) * 100)}</td>
        <td>${formatPercent(ratio(roundTotals.total.area, base.area) * 100)}</td>
      </tr>
    `,
    ...stageMeta.rounds.map((round, index) => {
      const total = roundTotals.rounds[index] || zeroTotal();
      return `
        <tr class="sub-row">
          <td>${escapeHtml(stage.unit)} ${index + 1}</td>
          <td>${escapeHtml(round.document || "")}</td>
          <td>${formatNumber(total.cases)}</td>
          <td>${formatArea(total.area)}</td>
          ${stage.hasCost ? `<td>${formatMoney(total.cost)}</td>` : ""}
          <td>${formatPercent(ratio(total.cases, base.cases) * 100)}</td>
          <td>${formatPercent(ratio(total.area, base.area) * 100)}</td>
        </tr>
      `;
    }),
    `
      <tr class="ongoing-row">
        <td><strong>Đang thực hiện${item.hasOngoing === false ? "" : ` (${escapeHtml(item.pendingLabel.toLowerCase())})`}</strong></td>
        <td></td>
        <td>${formatNumber(ongoing.cases)}</td>
        <td>${formatArea(ongoing.area)}</td>
        ${stage.hasCost ? "<td></td>" : ""}
        <td>${formatPercent(ratio(ongoing.cases, totalBase.cases) * 100)}</td>
        <td>${formatPercent(ratio(ongoing.area, totalBase.area) * 100)}</td>
      </tr>
    `,
    `
      <tr class="pending-row">
        <td><strong>Chưa thực hiện${item.hasOngoing === false ? ` (${escapeHtml(item.pendingLabel.toLowerCase())})` : " theo tổng dự án"}</strong></td>
        <td></td>
        <td>${formatNumber(notStarted.cases)}</td>
        <td>${formatArea(notStarted.area)}</td>
        ${stage.hasCost ? "<td></td>" : ""}
        <td>${formatPercent(ratio(notStarted.cases, totalBase.cases) * 100)}</td>
        <td>${formatPercent(ratio(notStarted.area, totalBase.area) * 100)}</td>
      </tr>
    `
  ];
  return rows.join("");
}

app.addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;

  if (button.dataset.view) {
    ui.view = button.dataset.view;
    render();
    return;
  }

  if (button.dataset.communeButton) {
    ui.communeId = button.dataset.communeButton;
    if (ui.view !== "update") ui.view = "update";
    render();
    return;
  }

  if (button.dataset.stageTab) {
    ui.stageId = button.dataset.stageTab;
    render();
    return;
  }

  if (button.dataset.reportScope) {
    ui.reportScope = button.dataset.reportScope;
    if (ui.reportScope !== "summary") ui.communeId = ui.reportScope;
    render();
    return;
  }

  const action = button.dataset.action;
  if (!action) return;

  if (action === "auth-mode") {
    ui.authMode = button.dataset.mode || "login";
    store.authError = "";
    store.authMessage = "";
    renderAuthShell();
    return;
  }

  if (action === "auth-login") {
    signIn();
    return;
  }

  if (action === "auth-signup") {
    signUp();
