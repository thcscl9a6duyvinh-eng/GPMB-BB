  }

  if (action === "auth-logout") {
    signOut();
    return;
  }

  if (action === "open-project") {
    switchProject(button.dataset.project);
    return;
  }

  if (action === "add-project") {
    addProject();
    return;
  }

  if (action === "rename-project") {
    renameCurrentProject(button.dataset.project);
    return;
  }

  if (action === "delete-project") {
    deleteCurrentProject(button.dataset.project);
    return;
  }

  if (action === "grant-project-access") {
    grantProjectAccess();
    return;
  }

  if (action === "remove-project-access") {
    removeProjectAccess(button.dataset.project, button.dataset.user);
    return;
  }

  if (action === "add-commune") {
    if (!requireProjectEdit()) return;
    addCommune();
    return;
  }

  if (action === "rename-commune") {
    if (!requireProjectEdit()) return;
    renameCurrentCommune();
    return;
  }

  if (action === "delete-commune") {
    if (!requireProjectEdit()) return;
    deleteCurrentCommune();
    return;
  }

  if (action === "add-parcel") {
    if (!requireProjectEdit()) return;
    addParcel(button.dataset.record);
    return;
  }

  if (action === "delete-parcel") {
    if (!requireProjectEdit()) return;
    deleteParcel(button.dataset.record, Number(button.dataset.parcelIndex));
    return;
  }

  if (action === "add-record") {
    if (!requireProjectEdit()) return;
    const commune = currentCommune();
    commune.records.push(newRecord(button.dataset.type, commune));
    ui.search = "";
    saveNow();
    render();
    return;
  }

  if (action === "add-stage-round") {
    if (!requireProjectEdit()) return;
    addStageRound(button.dataset.stage);
    saveNow();
    render();
    return;
  }

  if (action === "delete-stage-round") {
    if (!requireProjectEdit()) return;
    deleteStageRound(button.dataset.stage, Number(button.dataset.roundIndex));
    return;
  }

  if (action === "delete-record") {
    if (!requireProjectEdit()) return;
    deleteRecord(button.dataset.record);
    return;
  }

  if (action === "save") {
    saveNow();
    return;
  }

  if (action === "import-json") {
    importInput.click();
    return;
  }

  if (action === "export-json") {
    exportJson();
    return;
  }

  if (action === "export-csv") {
    exportCsv();
    return;
  }

  if (action === "print") {
    window.print();
  }
});

app.addEventListener("input", event => {
  handleInput(event.target, false);
});

app.addEventListener("change", event => {
  handleInput(event.target, true);
});

importInput.addEventListener("change", async event => {
  const file = event.target.files?.[0];
  if (!file) return;
  try {
    const text = await file.text();
    const imported = normalizeDb(JSON.parse(text));
    if (store.mode === "supabase") {
      await importProjectsToSupabase(imported);
      return;
    }
    db = imported;
    ui.projectId = db.activeProjectId;
    ui.communeId = projectCommunes()[0]?.id || ui.communeId;
    syncUiToProject();
    await saveNow();
    render();
  } catch (error) {
    alert(`Không nhập được JSON: ${error.message}`);
  } finally {
    importInput.value = "";
  }
});

async function importProjectsToSupabase(imported) {
  if (!canCreateProjects()) {
    alert("Chỉ tài khoản chủ mới được nhập JSON để tạo dự án trên Supabase.");
    return;
  }
  const ok = confirm(`Nhập ${imported.projects.length} dự án từ file JSON lên Supabase?`);
  if (!ok) return;
  for (const project of imported.projects) {
    const { error } = await store.client
      .from("projects")
      .insert({
        name: projectDisplayName(project),
        created_by: store.user.id,
        state: exportProjectState(project)
      });
    if (error) {
      alert(`Dừng nhập ở dự án "${projectDisplayName(project)}": ${error.message}`);
      return;
    }
  }
  await loadSupabaseState();
}

function handleInput(target, shouldRender) {
  if (!(target instanceof HTMLInputElement || target instanceof HTMLSelectElement || target instanceof HTMLTextAreaElement)) return;

  if (target.dataset.action === "search") {
    ui.search = target.value;
    if (shouldRender) render();
    return;
  }

  if (target.dataset.action === "type-filter") {
    ui.type = target.value;
    render();
    return;
  }

  if (target.dataset.action === "commune-select") {
    ui.communeId = target.value;
    render();
    return;
  }

  if (target.dataset.action === "project-select") {
    switchProject(target.value);
    return;
  }

  if (target.dataset.metaPath) {
    if (!requireProjectEdit()) {
      render();
      return;
    }
    const project = currentProject();
    setPath(project.meta, target.dataset.metaPath, target.value);
    if (target.dataset.metaPath === "projectName" && target.value.trim()) {
      project.name = target.value.trim();
    }
    scheduleSave();
    if (shouldRender) render();
    return;
  }

  if (target.dataset.note) {
    if (!requireProjectEdit()) {
      render();
      return;
    }
    projectNotes()[target.dataset.note] = target.value;
    scheduleSave();
    return;
  }

  if (target.dataset.communePath) {
    if (!requireProjectEdit()) {
      render();
      return;
    }
    const commune = findCommune(target.dataset.commune);
    if (!commune) return;
    setPath(commune, target.dataset.communePath, target.value);
    scheduleSave();
    if (shouldRender && target.tagName !== "TEXTAREA") render();
    return;
  }

  if (target.dataset.stageRoundDocument) {
    if (!requireProjectEdit()) {
      render();
      return;
    }
    const commune = currentCommune();
    const stageMeta = ensureCommuneStage(commune, target.dataset.stage);
    const round = stageMeta.rounds[Number(target.dataset.roundIndex)];
    if (round) {
      round.document = target.value;
      scheduleSave();
    }
    return;
  }

  const recordId = target.dataset.record;
  const path = target.dataset.path;
  if (!recordId || !path) return;
  if (!requireProjectEdit()) {
    render();
    return;
  }
  const record = findRecord(recordId);
  if (!record) return;
  setPath(record, path, target.value);
  scheduleSave();
  if (shouldRender && target.tagName !== "TEXTAREA") render();
}

async function addProject() {
  if (!canCreateProjects()) {
    alert("Chỉ tài khoản chủ mới được tạo dự án.");
    return;
  }
  const name = prompt("Tên dự án mới");
  if (!name || !name.trim()) return;
  const project = normalizeProject({
    id: nextProjectId(name),
    name: name.trim(),
    meta: { projectName: name.trim() },
    notes: {},
    communes: [createBlankCommune("Xã/Khu vực 1", "KV1")]
  }, db.projects.length);

  if (store.mode === "supabase") {
    const { data, error } = await store.client
      .from("projects")
      .insert({
        name: project.name,
        created_by: store.user.id,
        state: exportProjectState(project)
      })
      .select("id")
      .single();
    if (error) {
      alert(`Không tạo được dự án: ${error.message}`);
      return;
    }
    localStorage.setItem("gpmb.activeProjectId", data.id);
    await loadSupabaseState();
    return;
  }

  db.projects.push(project);
  switchProject(project.id, false);
  saveNow();
  render();
}

async function renameCurrentProject(projectId = null) {
  const project = projectId ? db.projects.find(item => item.id === projectId) : currentProject();
  if (!project) return;
  if (!canManageProject(project.id)) {
    alert("Tài khoản này không có quyền đổi tên dự án.");
    return;
  }
  const name = prompt("Tên dự án", projectDisplayName(project));
  if (!name || !name.trim()) return;
  project.name = name.trim();
  project.meta.projectName = name.trim();
  await saveProject(project);
  render();
}

async function deleteCurrentProject(projectId = null) {
  const project = projectId ? db.projects.find(item => item.id === projectId) : currentProject();
  if (!project) return;
  if (!canManageProject(project.id)) {
    alert("Tài khoản này không có quyền xóa dự án.");
    return;
  }
  if (db.projects.length <= 1) {
    alert("Phải giữ lại ít nhất 1 dự án để app tiếp tục hoạt động.");
    return;
  }
  const recordCount = project.communes.reduce((sum, commune) => sum + commune.records.length, 0);
  const ok = confirm(`Xóa dự án "${projectDisplayName(project)}" cùng ${project.communes.length} xã/khu vực và ${recordCount} hồ sơ bên trong?`);
  if (!ok) return;

  if (store.mode === "supabase") {
    const { error } = await store.client.from("projects").delete().eq("id", project.id);
    if (error) {
      alert(`Không xóa được dự án: ${error.message}`);
      return;
    }
    localStorage.removeItem("gpmb.activeProjectId");
    await loadSupabaseState();
    return;
  }

  db.projects = db.projects.filter(item => item.id !== project.id);
  switchProject(db.projects[0]?.id, false);
  saveNow();
  render();
}

async function grantProjectAccess() {
  if (store.mode !== "supabase") {
    alert("Phân quyền tài khoản hoạt động khi app dùng Supabase.");
    return;
  }
  const project = currentProject();
  if (!project || !canManageProject(project.id)) {
    alert("Tài khoản này không có quyền phân quyền dự án.");
    return;
  }
  const email = document.querySelector("[data-access-email]")?.value.trim();
  const role = document.querySelector("[data-access-role]")?.value || "editor";
  if (!email) {
    alert("Nhập email tài khoản cần thêm vào dự án.");
    return;
  }
  const { data: profile, error: profileError } = await store.client
    .from("profiles")
    .select("id,email,display_name")
    .eq("email", email)
    .maybeSingle();
  if (profileError) {
    alert(`Không tìm được tài khoản: ${profileError.message}`);
    return;
  }
  if (!profile) {
    alert("Email này chưa có tài khoản nội bộ. Hãy tạo tài khoản trước rồi phân quyền.");
    return;
  }
  const { error } = await store.client
    .from("project_members")
    .upsert({ project_id: project.id, user_id: profile.id, role }, { onConflict: "project_id,user_id" });
  if (error) {
    alert(`Không cấp quyền được: ${error.message}`);
    return;
  }
  await loadSupabaseState();
}

async function removeProjectAccess(projectId, userId) {
  if (store.mode !== "supabase") return;
  if (!canManageProject(projectId)) {
    alert("Tài khoản này không có quyền gỡ thành viên.");
    return;
  }
  const ok = confirm("Gỡ tài khoản này khỏi dự án?");
  if (!ok) return;
  const { error } = await store.client
    .from("project_members")
    .delete()
    .eq("project_id", projectId)
    .eq("user_id", userId);
  if (error) {
    alert(`Không gỡ quyền được: ${error.message}`);
    return;
  }
  await loadSupabaseState();
}

function switchProject(projectId, persist = true) {

  db.activeProjectId = projectId;
  ui.projectId = projectId;
  localStorage.setItem("gpmb.activeProjectId", projectId);

function addCommune() {
  const name = prompt("Tên xã/khu vực mới");
  if (!name || !name.trim()) return;
  const commune = normalizeCommune({
    id: nextCommuneId(name),
    name: name.trim(),
    positionNote: "",

  });
  projectCommunes().push(commune);
  ui.communeId = commune.id;
  ui.reportScope = commune.id;
  saveNow();
  render();
}

function renameCurrentCommune() {
  const commune = currentCommune();
  if (!commune) return;
  const name = prompt("Tên xã/khu vực", commune.name || "");
  if (!name || !name.trim()) return;
  commune.name = name.trim();

function deleteCurrentCommune() {
  const commune = currentCommune();
  if (!commune) return;
  const communes = projectCommunes();
  if (communes.length <= 1) {
    alert("Phải giữ lại ít nhất 1 xã/khu vực để app tiếp tục hoạt động.");
    return;
  }
  const ok = confirm(`Xóa xã/khu vực "${commune.name}" và toàn bộ ${commune.records.length} hồ sơ bên trong?`);
  if (!ok) return;
  currentProject().communes = communes.filter(item => item.id !== commune.id);
  const nextCommune = projectCommunes()[0];
  ui.communeId = nextCommune?.id || "";
  ui.reportScope = ui.view === "report" ? "summary" : ui.communeId;
  saveNow();
  render();

function addParcel(recordId) {
  const record = findRecord(recordId);
  if (!record) return;
  record.parcels.push(blankParcel());
  STAGES.forEach(stage => ensureRecordStageLength(record, stage.id, record.stages?.[stage.id]?.rounds?.length || stage.defaultRounds));
  ensureRecordSpecialParcelLength(record);
  saveNow();
  render();
}

function deleteParcel(recordId, parcelIndex) {
  const record = findRecord(recordId);
  if (!record) return;
  if (record.parcels.length <= 1) {
    alert("Phải giữ lại ít nhất 1 thửa đất trong hồ sơ.");
    return;
  }
  const ok = confirm(`Xóa thửa đất số ${parcelIndex + 1} của hồ sơ "${displayOwner(record)}"?`);
  if (!ok) return;
  record.parcels.splice(parcelIndex, 1);
  STAGES.forEach(stage => {
    const rounds = record.stages?.[stage.id]?.rounds || [];
    rounds.forEach(round => {
      if (Array.isArray(round.parcels)) round.parcels.splice(parcelIndex, 1);
    });
    ensureRecordStageLength(record, stage.id, rounds.length || stage.defaultRounds);
  });
  ["recoveryDecision", "handoverPaid", "handoverEarly"].forEach(key => {
    if (Array.isArray(record[key]?.parcels)) record[key].parcels.splice(parcelIndex, 1);
  });
  ensureRecordSpecialParcelLength(record);
  saveNow();
  render();
}

function ensureRecordSpecialParcelLength(record) {
  ["recoveryDecision", "handoverPaid", "handoverEarly"].forEach(key => {
    record[key] ||= {};
    record[key].parcels = normalizeAreaParcelList(record[key], record.parcels || []);
  });
}

function nextCommuneId(name) {
  const base = (name || "KV")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/Đ/g, "D")
    .toUpperCase()
    .replace(/[^A-Z0-9]+/g, "")
    .slice(0, 10) || "KV";
  let id = base;
  let index = 1;
  const used = new Set(projectCommunes().map(commune => commune.id));
  while (used.has(id)) {
    index += 1;
    id = `${base}${index}`;
  }
  return id;
}

function deleteRecord(recordId) {
  const commune = currentCommune();
  const record = commune.records.find(item => item.id === recordId);
  if (!record) return;
  const owner = displayOwner(record);
  const ok = confirm(`Xóa hồ sơ "${owner}"?`);
  if (!ok) return;
  commune.records = commune.records.filter(item => item.id !== recordId);
  saveNow();
  render();
}

function currentCommune() {
  const communes = projectCommunes();
  return communes.find(commune => commune.id === ui.communeId) || communes[0];
}

function findRecord(recordId) {
  for (const commune of projectCommunes()) {
    const found = commune.records.find(record => record.id === recordId);
    if (found) return found;
  }
  return null;
}

function findCommune(communeId) {
  return projectCommunes().find(commune => commune.id === communeId);
}

function ensureCommuneStage(commune, stageId) {
  commune.stageRounds ||= {};
  const stage = STAGES.find(item => item.id === stageId);
  const defaultRounds = stage?.defaultRounds || 1;
  if (!commune.stageRounds[stageId]) {
    commune.stageRounds[stageId] = { rounds: Array.from({ length: defaultRounds }, () => ({ document: "" })) };
  }
  const stageMeta = commune.stageRounds[stageId];
  if (!Array.isArray(stageMeta.rounds)) stageMeta.rounds = [];
  if (!stageMeta.rounds.length) stageMeta.rounds.push({ document: "" });
  stageMeta.rounds = stageMeta.rounds.map(round => ({ document: round?.document || "" }));
  commune.records.forEach(record => ensureRecordStageLength(record, stageId, stageMeta.rounds.length));
  return stageMeta;
}

function ensureRecordStageLength(record, stageId, roundCount) {
  record.stages ||= {};
  record.stages[stageId] ||= { rounds: [], note: "" };
  const stageData = record.stages[stageId];
  if (!Array.isArray(stageData.rounds)) stageData.rounds = [];
  while (stageData.rounds.length < roundCount) {
    stageData.rounds.push(blankRound(record.parcels || []));
  }
  if (stageData.rounds.length > roundCount) {
    stageData.rounds = stageData.rounds.slice(0, roundCount);
  }
  stageData.rounds = stageData.rounds.map(round => normalizeStageRound(round, record.parcels || []));
}

function blankRound(recordParcels = []) {
  return normalizeStageRound({}, recordParcels);
}

function addStageRound(stageId) {
  const commune = currentCommune();
  const stageMeta = ensureCommuneStage(commune, stageId);
  stageMeta.rounds.push({ document: "" });
  commune.records.forEach(record => ensureRecordStageLength(record, stageId, stageMeta.rounds.length));
}

function deleteStageRound(stageId, roundIndex) {
  const commune = currentCommune();
  const stageMeta = ensureCommuneStage(commune, stageId);
  const stage = STAGES.find(item => item.id === stageId);
  if (stageMeta.rounds.length <= 1) {
    alert(`Phải giữ lại ít nhất 1 ${stage?.unit?.toLowerCase() || "đợt/lần"}.`);
    return;
  }
  const ok = confirm(`Xóa ${stage?.unit || "Đợt/Lần"} ${roundIndex + 1}? Dữ liệu ở cột này của tất cả hồ sơ trong xã hiện tại cũng sẽ bị xóa.`);
  if (!ok) return;
  stageMeta.rounds.splice(roundIndex, 1);
  commune.records.forEach(record => {
    ensureRecordStageLength(record, stageId, stageMeta.rounds.length + 1);
    record.stages[stageId].rounds.splice(roundIndex, 1);
    ensureRecordStageLength(record, stageId, stageMeta.rounds.length);
  });
  saveNow();
  render();
}

function setPath(target, path, value) {
  const parts = path.split(".");
  let cursor = target;
  for (let index = 0; index < parts.length - 1; index += 1) {
    const key = numericKey(parts[index]);
    if (cursor[key] == null) cursor[key] = {};
    cursor = cursor[key];
  }
  cursor[numericKey(parts.at(-1))] = value;
}

function numericKey(value) {
  return /^\d+$/.test(value) ? Number(value) : value;
}

function scheduleSave() {
  ui.saveText = "Đang nhập...";
  updateSaveStatus();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 650);
}

async function saveNow() {
  clearTimeout(saveTimer);
  ui.saveText = "Đang lưu...";
  updateSaveStatus();
  try {
    if (store.mode === "supabase") {
      if (!canEditCurrentProject()) throw new Error("Tài khoản chưa có quyền chỉnh sửa dự án");
      await saveProject(currentProject(), false);
      ui.saveText = `Đã lưu ${new Date().toLocaleTimeString("vi-VN")}`;
      updateSaveStatus();
      return;
    }
    const response = await fetch("/api/state", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(db)
    });
    if (!response.ok) throw new Error("Lưu thất bại");
    db = normalizeDb(await response.json());
    ui.saveText = `Đã lưu ${new Date().toLocaleTimeString("vi-VN")}`;
  } catch (error) {
    ui.saveText = error.message;
  }
  updateSaveStatus();
}

async function saveProject(project, updateStatus = true) {
  if (!project) return;
  if (store.mode !== "supabase") {
    await saveNow();
    return;
  }
  const { data, error } = await store.client
    .from("projects")
    .update({
      name: projectDisplayName(project),
      state: exportProjectState(project),
      updated_at: new Date().toISOString()
    })
    .eq("id", project.id)
    .select("updated_at")
    .single();
  if (error) throw error;
  project.updatedAt = data?.updated_at || new Date().toISOString();
  if (updateStatus) {
    ui.saveText = `Đã lưu ${new Date().toLocaleTimeString("vi-VN")}`;
    updateSaveStatus();
  }
}

function updateSaveStatus() {
  const node = document.querySelector(".save-status span");
  if (node) node.textContent = ui.saveText;
}

function communeTotals(commune) {
  const records = commune.records;
  const byType = {
    household: {
      original: countArea(records.filter(record => record.type === "household"), "original"),
      adjusted: countArea(records.filter(record => record.type === "household"), "adjusted")
    },
    organization: {
      original: countArea(records.filter(record => record.type === "organization"), "original"),
      adjusted: countArea(records.filter(record => record.type === "organization"), "adjusted")
    }
  };

  const stages = {};
  STAGES.forEach(stage => {
    stages[stage.id] = stageTotal(records, stage.id);
  });

  const recoveryDecision = records.reduce((acc, record) => addTotals(acc, {
    cases: caseCount(record.recoveryDecision.cases),
    area: areaParcelTotal(record.recoveryDecision).area,
    cost: 0
  }), zeroTotal());

  const paid = records.reduce((acc, record) => addTotals(acc, {
    cases: caseCount(record.handoverPaid.cases),
    area: areaParcelTotal(record.handoverPaid).area,
    cost: 0
  }), zeroTotal());

  const early = records.reduce((acc, record) => addTotals(acc, {
    cases: caseCount(record.handoverEarly.cases),
    area: areaParcelTotal(record.handoverEarly).area,
    cost: 0
  }), zeroTotal());

  const approvedPending = {
    cases: stages.planDecision.cases - paid.cases,
    area: stages.planDecision.area - paid.area,
    cost: 0
  };

  const adjusted = addTotals(byType.household.adjusted, byType.organization.adjusted);
  const original = addTotals(byType.household.original, byType.organization.original);
  const unapprovedPending = {
    cases: adjusted.cases - stages.planDecision.cases,
    area: adjusted.area - stages.planDecision.area,
    cost: 0
  };

  return {
    original,
    adjusted,
    byType,
    stages,
    recoveryDecision,
    handover: {
      paid,
      early,
      total: addTotals(paid, early)
    },
    notHandover: {
      approved: approvedPending,
      unapproved: unapprovedPending,
      total: addTotals(approvedPending, unapprovedPending)
    }
  };
}

function aggregateAll() {
  const seed = {
    original: zeroTotal(),
    adjusted: zeroTotal(),
    byType: {
      household: { original: zeroTotal(), adjusted: zeroTotal() },
      organization: { original: zeroTotal(), adjusted: zeroTotal() }
    },
    stages: Object.fromEntries(STAGES.map(stage => [stage.id, zeroTotal()])),
    recoveryDecision: zeroTotal(),
    handover: { paid: zeroTotal(), early: zeroTotal(), total: zeroTotal() },
    notHandover: { approved: zeroTotal(), unapproved: zeroTotal(), total: zeroTotal() }
  };

  return projectCommunes().reduce((acc, commune) => {
    const totals = communeTotals(commune);
    acc.original = addTotals(acc.original, totals.original);
    acc.adjusted = addTotals(acc.adjusted, totals.adjusted);
    acc.byType.household.original = addTotals(acc.byType.household.original, totals.byType.household.original);
    acc.byType.household.adjusted = addTotals(acc.byType.household.adjusted, totals.byType.household.adjusted);
    acc.byType.organization.original = addTotals(acc.byType.organization.original, totals.byType.organization.original);
    acc.byType.organization.adjusted = addTotals(acc.byType.organization.adjusted, totals.byType.organization.adjusted);
    STAGES.forEach(stage => {
      acc.stages[stage.id] = addTotals(acc.stages[stage.id], totals.stages[stage.id]);
    });
    acc.recoveryDecision = addTotals(acc.recoveryDecision, totals.recoveryDecision);
    acc.handover.paid = addTotals(acc.handover.paid, totals.handover.paid);
    acc.handover.early = addTotals(acc.handover.early, totals.handover.early);
    acc.handover.total = addTotals(acc.handover.total, totals.handover.total);
    acc.notHandover.approved = addTotals(acc.notHandover.approved, totals.notHandover.approved);
    acc.notHandover.unapproved = addTotals(acc.notHandover.unapproved, totals.notHandover.unapproved);
    acc.notHandover.total = addTotals(acc.notHandover.total, totals.notHandover.total);
    return acc;
  }, seed);
}

function aggregateCommuneList(communes) {
  const seed = {
    original: zeroTotal(),
    adjusted: zeroTotal(),
    byType: {
      household: { original: zeroTotal(), adjusted: zeroTotal() },
      organization: { original: zeroTotal(), adjusted: zeroTotal() }
    },
    stages: Object.fromEntries(STAGES.map(stage => [stage.id, zeroTotal()])),
    recoveryDecision: zeroTotal(),
    handover: { paid: zeroTotal(), early: zeroTotal(), total: zeroTotal() },
    notHandover: { approved: zeroTotal(), unapproved: zeroTotal(), total: zeroTotal() }
  };

  return communes.reduce((acc, commune) => {
    const totals = communeTotals(commune);
    acc.original = addTotals(acc.original, totals.original);
    acc.adjusted = addTotals(acc.adjusted, totals.adjusted);
    acc.byType.household.original = addTotals(acc.byType.household.original, totals.byType.household.original);
    acc.byType.household.adjusted = addTotals(acc.byType.household.adjusted, totals.byType.household.adjusted);
    acc.byType.organization.original = addTotals(acc.byType.organization.original, totals.byType.organization.original);
    acc.byType.organization.adjusted = addTotals(acc.byType.organization.adjusted, totals.byType.organization.adjusted);
    STAGES.forEach(stage => {
      acc.stages[stage.id] = addTotals(acc.stages[stage.id], totals.stages[stage.id]);
    });
    acc.recoveryDecision = addTotals(acc.recoveryDecision, totals.recoveryDecision);
    acc.handover.paid = addTotals(acc.handover.paid, totals.handover.paid);
    acc.handover.early = addTotals(acc.handover.early, totals.handover.early);
    acc.handover.total = addTotals(acc.handover.total, totals.handover.total);
    acc.notHandover.approved = addTotals(acc.notHandover.approved, totals.notHandover.approved);
    acc.notHandover.unapproved = addTotals(acc.notHandover.unapproved, totals.notHandover.unapproved);
    acc.notHandover.total = addTotals(acc.notHandover.total, totals.notHandover.total);
    return acc;
  }, seed);
}

function isQuantitativeReportItem(item) {
  return item.kind !== "position" && item.kind !== "remarks";
}

function reportProgress(item, totals) {
  if (item.kind === "handover") {
    const parts = handoverReportParts(totals);
    return reportProgressFromParts(item, parts);
  }
  if (item.kind === "notHandover") {
    const parts = notHandoverReportParts(totals);
    return reportProgressFromParts(item, parts);
  }
  if (item.kind === "recoveryDecision") {
    return reportProgressFromParts(item, recoveryDecisionReportParts(totals));
  }

  const base = getTotalByRef(totals, item.baseRef);
  const done = getTotalByRef(totals, item.doneRef);
  return reportProgressFromParts(item, {
    totalBase: totals.adjusted,
    base,
    done,
    ongoing: item.hasOngoing === false ? zeroTotal() : subtractTotals(base, done),
    notStarted: subtractTotals(totals.adjusted, done)
  });
}

function reportProgressFromParts(item, parts) {
  const totalBase = parts.totalBase || parts.projectBase || parts.base || zeroTotal();
  const ongoing = parts.ongoing || parts.pending || zeroTotal();
  const notStarted = parts.notStarted || subtractTotals(totalBase, parts.done || zeroTotal());
  return {
    totalBase,
    base: parts.base || totalBase,
    done: parts.done || zeroTotal(),
    ongoing,
    notStarted,
    doneLabel: item.doneLabel,
    ongoingLabel: item.ongoingLabel || (item.pendingLabel ? `Đang thực hiện (${item.pendingLabel.toLowerCase()})` : "Đang thực hiện"),
    notStartedLabel: item.notStartedLabel || "Chưa thực hiện theo tổng dự án",
    casePercent: ratio((parts.done || zeroTotal()).cases, totalBase.cases) * 100,
    areaPercent: ratio((parts.done || zeroTotal()).area, totalBase.area) * 100
  };
}

function getTotalByRef(totals, ref) {
  if (ref === "original") return totals.original;
  if (ref === "adjusted") return totals.adjusted;
  if (ref === "recoveryDecision") return totals.recoveryDecision;
  if (ref === "handover.total") return totals.handover.total;
  if (ref?.startsWith("stages.")) {
    return totals.stages[ref.split(".")[1]] || zeroTotal();
  }
  return zeroTotal();
}

function recoveryDecisionReportParts(totals) {
  const base = totals.stages.planDecision;
  const done = totals.recoveryDecision;
  return {
    totalBase: totals.adjusted,
    base,
    done,
    ongoing: subtractTotals(base, done),
    notStarted: subtractTotals(totals.adjusted, done)
  };
}

function handoverReportParts(totals) {
  const base = totals.adjusted;
  const ongoingBase = totals.stages.planDecision;
  const paid = totals.handover.paid;
  const early = totals.handover.early;
  const done = addTotals(paid, early);
  return {
    totalBase: base,
    base,
    paid,
    early,
    done,
    ongoing: subtractTotals(ongoingBase, paid),
    notStarted: subtractTotals(base, done)
  };
}

function notHandoverReportParts(totals) {
  const base = totals.adjusted;
  const approved = subtractTotals(totals.stages.planDecision, totals.handover.paid);
  const unapproved = subtractTotals(totals.adjusted, totals.stages.planDecision);
  const done = addTotals(approved, unapproved);
  return {
    totalBase: base,
    base,
    approved,
    unapproved,
    done,
    ongoing: approved,
    notStarted: unapproved
  };
}

function buildProgressRows(totals) {
  const rows = [];
  const getBase = base => {
    if (base === "adjusted") return totals.adjusted;
    return totals.stages[base] || totals.adjusted;
  };

  STAGES.forEach(stage => {
    const done = totals.stages[stage.id];
    const base = getBase(stage.base);
    rows.push(progressData(stage.name, done, base));
  });

  rows.push(progressData("Tổng quyết định thu hồi đất", totals.recoveryDecision, totals.stages.planDecision));
  rows.push(progressData("Bàn giao mặt bằng", totals.handover.total, totals.adjusted));
  rows.push({
    name: "Chưa giao mặt bằng",
    done: totals.notHandover.total,
    base: totals.adjusted,
    pending: subtractTotals(totals.adjusted, totals.notHandover.total),
    percent: ratio(totals.notHandover.total.cases, totals.adjusted.cases) * 100,
    areaPercent: ratio(totals.notHandover.total.area, totals.adjusted.area) * 100
  });
  return rows;
}

function progressData(name, done, base) {
  return {
    name,
    done,
    base,
    pending: subtractTotals(base, done),
    percent: ratio(done.cases, base.cases) * 100,
    areaPercent: ratio(done.area, base.area) * 100
  };
}

function countArea(records, source) {
  return records.reduce((acc, record) => {
    const hasCase = source === "original" ? originalCase(record) : adjustedCase(record);
    return {
      cases: acc.cases + hasCase,
      area: acc.area + recordArea(record, source),
      cost: 0
    };
  }, zeroTotal());
}

function originalCase(record) {
  return hasText(record.original.landUser) || recordArea(record, "original") > 0 ? 1 : 0;
}

function adjustedCase(record) {
  return hasText(record.adjusted.landUser) || recordArea(record, "adjusted") > 0 ? 1 : 0;
}

function recordArea(record, source) {
  const key = source === "original" ? "original" : "adjusted";
  const parcelArea = (record.parcels || []).reduce((sum, parcel) => sum + safeNum(parcel[key]?.area), 0);
  if (parcelArea > 0) return parcelArea;
  return safeNum(record[key]?.area);
}

function parcelSummary(record) {
  const parcels = record.parcels || [];
  if (!parcels.length) return "Chưa có thửa đất";
  const first = parcels[0];
  const firstText = [first.original.mapSheet, first.original.parcelNo].filter(Boolean).join(" / ");
  return `${parcels.length} thửa${firstText ? `, thửa đầu: ${firstText}` : ""}`;
}

function stageTotal(records, stageId) {
  return records.reduce((acc, record) => addTotals(acc, totalRounds(record.stages[stageId]?.rounds || [])), zeroTotal());
}

function stageRoundTotals(records, stageId, roundCount = 0) {
  const maxRecordRounds = records.reduce((max, record) => {
    const rounds = record.stages?.[stageId]?.rounds;
    return Math.max(max, Array.isArray(rounds) ? rounds.length : 0);
  }, 0);
  const rounds = Array.from({ length: Math.max(roundCount, maxRecordRounds, 1) }, () => zeroTotal());
  records.forEach(record => {
    (record.stages[stageId]?.rounds || []).forEach((round, index) => {
      const parcelTotal = roundParcelTotal(round);
      rounds[index] = addTotals(rounds[index], {
        cases: caseCount(round.cases),
        area: parcelTotal.area,
        cost: parcelTotal.cost
      });
    });
  });
  return {
    rounds,
    total: rounds.reduce((acc, round) => addTotals(acc, round), zeroTotal())
  };
}

function totalRounds(rounds) {
  return rounds.reduce((acc, round) => {
    const parcelTotal = roundParcelTotal(round);
    return addTotals(acc, {
      cases: caseCount(round.cases),
      area: parcelTotal.area,
      cost: parcelTotal.cost
    });
  }, zeroTotal());
}

function stageParcelTotal(record, stageId, parcelIndex) {
  return (record.stages?.[stageId]?.rounds || []).reduce((acc, round) => addTotals(acc, {
    cases: 0,
    area: safeNum(round.parcels?.[parcelIndex]?.area),
    cost: safeNum(round.parcels?.[parcelIndex]?.cost)
  }), zeroTotal());
}

function roundParcelTotal(round) {
  const parcels = Array.isArray(round?.parcels) ? round.parcels : [];
  if (parcels.length) {
    return parcels.reduce((acc, parcel) => addTotals(acc, {
      cases: 0,
      area: safeNum(parcel.area),
      cost: safeNum(parcel.cost)
    }), zeroTotal());
  }
  return {
    cases: 0,
    area: safeNum(round?.area),
    cost: safeNum(round?.cost)
  };
}

function areaParcelTotal(section) {
  const parcels = Array.isArray(section?.parcels) ? section.parcels : [];
  if (parcels.length) {
    return parcels.reduce((acc, parcel) => addTotals(acc, {
      cases: 0,
      area: safeNum(parcel.area),
      cost: 0
    }), zeroTotal());
  }
  return { cases: 0, area: safeNum(section?.area), cost: 0 };
}

function zeroTotal() {
  return { cases: 0, area: 0, cost: 0 };
}

function addTotals(a, b) {
  return {
    cases: safeNum(a.cases) + safeNum(b.cases),
    area: safeNum(a.area) + safeNum(b.area),
    cost: safeNum(a.cost) + safeNum(b.cost)
  };
}

function subtractTotals(a, b) {
  return {
    cases: safeNum(a.cases) - safeNum(b.cases),
    area: safeNum(a.area) - safeNum(b.area),
    cost: safeNum(a.cost) - safeNum(b.cost)
  };
}

function caseCount(value) {
  return hasText(value) ? 1 : 0;
}

function exportJson() {
  const name = slugify(projectDisplayName(currentProject()) || "gpmb");
  downloadBlob(JSON.stringify(db, null, 2), `gpmb-${name}.json`, "application/json;charset=utf-8");
}

function exportCsv() {
  const commune = currentCommune();
  const rows = [];
  const headers = [
    "Xã/khu vực",
    "Mã hồ sơ",
    "Loại hồ sơ",
    "STT thửa",
    "Tờ bản đồ",
    "Thửa đất",
    "Tên chủ sử dụng đất gốc",
    "Địa chỉ gốc",
    "Thông báo thu hồi đất",
    "Diện tích gốc",
    "Loại đất gốc",
    "Tên sau kiểm đếm",
    "Địa chỉ điều chỉnh",
    "Thông báo điều chỉnh",
    "Diện tích sau kiểm đếm",
    "Loại đất điều chỉnh",
    ...STAGES.flatMap(stage => [`${stage.shortName} - trường hợp`, `${stage.shortName} - diện tích`, `${stage.shortName} - chi phí`]),
    "Quyết định thu hồi đất - trường hợp",
    "Quyết định thu hồi đất - diện tích",
    "Đã nhận tiền - trường hợp",
    "Đã nhận tiền - diện tích",
    "Giao mặt bằng trước - trường hợp",
    "Giao mặt bằng trước - diện tích",
    "Ghi chú"
  ];
  rows.push(headers);
  commune.records.forEach(record => {
    record.parcels.forEach((parcel, index) => {
      rows.push([
        commune.name,
        record.id,
        record.type === "organization" ? "To chuc" : "Ho",
        index + 1,
        parcel.original.mapSheet,
        parcel.original.parcelNo,
        record.original.landUser,
        record.original.address,
        parcel.original.recoveryNotice,
        parcel.original.area,
        parcel.original.landType,
        record.adjusted.landUser,
        record.adjusted.address,
        parcel.adjusted.adjustedNotice,
        parcel.adjusted.area,
        parcel.adjusted.landType,
        ...STAGES.flatMap(stage => {
          const total = stageParcelTotal(record, stage.id, index);
          return [index === 0 ? totalRounds(record.stages[stage.id].rounds).cases : "", total.area, total.cost];
        }),
        index === 0 ? caseCount(record.recoveryDecision.cases) : "",
        record.recoveryDecision.parcels?.[index]?.area || "",
        index === 0 ? caseCount(record.handoverPaid.cases) : "",
        record.handoverPaid.parcels?.[index]?.area || "",
        index === 0 ? caseCount(record.handoverEarly.cases) : "",
        record.handoverEarly.parcels?.[index]?.area || "",
        record.remarks
      ]);
    });
  });
  const csv = rows.map(row => row.map(csvCell).join(",")).join("\r\n");
  const projectName = slugify(projectDisplayName(currentProject()));
  downloadBlob(csv, `gpmb-${projectName}-${commune.id.toLowerCase()}.csv`, "text/csv;charset=utf-8");
}

function csvCell(value) {
  const text = String(value ?? "");
  return `"${text.replace(/"/g, '""')}"`;
}

function downloadBlob(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function slugify(value) {
  return String(value || "du-an")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/Đ/g, "D")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 60) || "du-an";
}

function displayOwner(record) {
  return record.adjusted.landUser || record.original.landUser || "Hồ sơ chưa đặt tên";
}

function safeNum(value) {
  const num = Number(String(value ?? "").replace(",", "."));
  return Number.isFinite(num) ? num : 0;
}

function ratio(value, base) {
  const numerator = safeNum(value);
  const denominator = safeNum(base);
  if (!denominator) return numerator ? 1 : 0;
  return numerator / denominator;
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function hasText(value) {
  return String(value ?? "").trim().length > 0;
}

function normalizeText(value) {
  return String(value ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/Đ/g, "D")
    .toLowerCase();
}

function formatNumber(value) {
  return new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 0 }).format(safeNum(value));
}

function formatArea(value) {
  return new Intl.NumberFormat("vi-VN", { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(safeNum(value));
}

function formatMoney(value) {
  return new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 0 }).format(safeNum(value));
}

function formatPercent(value) {
  return `${new Intl.NumberFormat("vi-VN", { minimumFractionDigits: 0, maximumFractionDigits: 1 }).format(safeNum(value))}%`;
}

function formatDate(value) {
  if (!value) return "";
  const date = new Date(`${value}T00:00:00`);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleDateString("vi-VN");
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/`/g, "&#096;");
}

function refreshIcons() {
  if (window.lucide?.createIcons) {
    window.lucide.createIcons({
      attrs: {
        width: 17,
        height: 17,
        "stroke-width": 2
      }
    });
  }
}
